<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERVENOW | المتجر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>
      :root {
        --sp-radius: 22px;
        --sp-shadow: 0 14px 48px rgba(42, 24, 16, 0.1);
        --sp-shadow-soft: 0 8px 32px rgba(42, 24, 16, 0.07);
      }

      .store-shell {
        max-width: 1040px;
        margin: 0 auto;
        padding: 20px 16px 56px;
      }

      .store-breadcrumb {
        margin-bottom: 16px;
        font-weight: 700;
      }

      .store-breadcrumb a {
        text-decoration: none;
      }

      .store-header-wrap {
        margin-bottom: 20px;
      }

      .store-header {
        border-radius: var(--sp-radius);
        overflow: hidden;
        background: #fffcfa;
        border: 1px solid rgba(61, 34, 19, 0.08);
        box-shadow: var(--sp-shadow);
      }

      .store-header__banner {
        position: relative;
        width: 100%;
        aspect-ratio: 21 / 9;
        min-height: 140px;
        background: linear-gradient(120deg, #efe6dc, #f4ebe3 45%, #e8d9cc);
      }

      .store-header__banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .store-header__content {
        padding: 20px 20px 22px;
      }

      .store-header__content h1 {
        margin: 0 0 8px;
        font-size: clamp(1.35rem, 4vw, 1.85rem);
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      .store-header__cat {
        margin: 0 0 10px;
        font-size: 0.95rem;
        font-weight: 700;
        color: #7a6558;
      }

      .store-header__dist {
        margin: 0 0 8px;
        font-size: 0.92rem;
        font-weight: 800;
        color: #b9872f;
      }

      .store-header__rating {
        margin: 0 0 18px;
        font-size: 0.88rem;
        color: #5c4638;
      }

      .store-order-btn {
        width: 100%;
        max-width: 360px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 22px;
        border: none;
        border-radius: 16px;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 800;
        cursor: pointer;
        color: #fffdf8;
        background: linear-gradient(135deg, #3d2213, #6b3d22);
        box-shadow: 0 10px 32px rgba(61, 34, 19, 0.28);
        transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      }

      .store-order-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 40px rgba(61, 34, 19, 0.32);
        filter: brightness(1.05);
      }

      .store-order-btn:active {
        transform: translateY(0);
      }

      .store-order-btn:focus-visible {
        outline: 3px solid #c9a227;
        outline-offset: 3px;
      }

      .store-section {
        border-radius: var(--sp-radius);
        box-shadow: var(--sp-shadow-soft);
      }

      .store-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 18px;
      }

      .store-section-head h2 {
        margin: 0;
        font-size: clamp(1.2rem, 3vw, 1.45rem);
        font-weight: 800;
        color: #3d2213;
      }

      .store-cart-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        font-weight: 800;
        font-size: 0.95rem;
        color: #5b371d;
        padding: 10px 14px;
        border-radius: 14px;
        background: rgba(201, 162, 39, 0.12);
        border: 1px solid rgba(91, 55, 29, 0.12);
        transition: background 0.2s, transform 0.15s;
      }

      .store-cart-link:hover {
        background: rgba(201, 162, 39, 0.22);
      }

      #cartCount {
        min-width: 1.5em;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .prod-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr));
        gap: clamp(16px, 2.2vw, 24px);
      }

      @media (min-width: 900px) {
        .prod-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (max-width: 480px) {
        .prod-grid {
          grid-template-columns: 1fr;
        }
      }

      .prod-card {
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: #fffefb;
        border: 1px solid rgba(61, 34, 19, 0.07);
        box-shadow: 0 10px 36px rgba(42, 24, 16, 0.07);
        transition: box-shadow 0.25s, transform 0.2s;
        height: 100%;
      }

      .prod-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 48px rgba(42, 24, 16, 0.11);
      }

      .prod-card--unavailable {
        opacity: 0.88;
        filter: grayscale(0.2);
      }

      .prod-card__media {
        position: relative;
        aspect-ratio: 4 / 3;
        min-height: 168px;
        background: linear-gradient(145deg, #f0ebe3, #e8dfd4);
      }

      .prod-card__media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .prod-card__placeholder {
        width: 100%;
        height: 100%;
        min-height: 140px;
        background: linear-gradient(160deg, #ebe4dc 0%, #ddd4cb 45%, #e8e1d8 100%);
      }

      .prod-card__desc--empty {
        color: #9a8a7e;
        font-style: italic;
      }

      .prod-card__badges {
        position: absolute;
        top: 10px;
        inset-inline-start: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        z-index: 1;
      }

      .prod-badge {
        font-size: 0.72rem;
        font-weight: 800;
        padding: 5px 10px;
        border-radius: 999px;
      }

      .prod-badge--ok {
        background: linear-gradient(135deg, #1a6b3c, #239954);
        color: #fff;
        box-shadow: 0 4px 12px rgba(26, 107, 60, 0.35);
      }

      .prod-badge--out {
        background: #8b2942;
        color: #fff;
      }

      .prod-card__body {
        padding: 16px 16px 18px;
        display: flex;
        flex-direction: column;
        flex: 1;
        gap: 6px;
      }

      .prod-card__title {
        margin: 0;
        font-size: 1.06rem;
        font-weight: 800;
        line-height: 1.35;
        color: #2c1810;
        letter-spacing: -0.02em;
      }

      .prod-card__desc {
        margin: 0;
        font-size: 0.86rem;
        color: #6b5347;
        line-height: 1.5;
        min-height: 2.58em;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .prod-card__price-row {
        margin-top: auto;
        padding-top: 8px;
      }

      .prod-card__price {
        font-size: 1.38rem;
        font-weight: 800;
        color: #a67c00;
        letter-spacing: -0.03em;
      }

      .prod-card__price small {
        font-size: 0.76rem;
        font-weight: 700;
        color: #7a6558;
        margin-inline-start: 4px;
      }

      .prod-qty {
        display: flex;
        align-items: stretch;
        justify-content: center;
        margin-top: 14px;
        border-radius: 14px;
        border: 1px solid rgba(61, 34, 19, 0.12);
        overflow: hidden;
        background: #faf7f2;
      }

      .prod-qty-btn {
        width: 46px;
        min-height: 46px;
        border: none;
        background: transparent;
        font-size: 1.35rem;
        font-weight: 700;
        color: #3d2213;
        cursor: pointer;
        line-height: 1;
        transition: background 0.15s;
        font-family: inherit;
      }

      .prod-qty-btn:hover {
        background: rgba(61, 34, 19, 0.06);
      }

      .prod-qty-btn:focus-visible {
        outline: none;
        box-shadow: inset 0 0 0 2px #c9a227;
      }

      .prod-qty-input {
        width: 52px;
        text-align: center;
        border: none;
        background: transparent;
        font-weight: 800;
        font-size: 1rem;
        color: #2c1810;
        font-family: inherit;
        padding: 8px 0;
        -moz-appearance: textfield;
      }

      .prod-qty-input::-webkit-outer-spin-button,
      .prod-qty-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .btn-add-cart {
        margin-top: 12px;
        width: 100%;
        padding: 14px 16px;
        border: none;
        border-radius: 14px;
        font-family: inherit;
        font-size: 0.98rem;
        font-weight: 800;
        cursor: pointer;
        color: #fffdf8;
        background: linear-gradient(135deg, #3d2213, #6b3d22);
        box-shadow: 0 8px 24px rgba(61, 34, 19, 0.22);
        transition: transform 0.15s, box-shadow 0.2s, filter 0.15s;
      }

      .btn-add-cart:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.04);
        box-shadow: 0 12px 28px rgba(61, 34, 19, 0.28);
      }

      .btn-add-cart:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        filter: grayscale(0.2);
      }

      .store-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translate(-50%, 120px);
        z-index: 10050;
        max-width: min(92vw, 400px);
        padding: 14px 20px;
        border-radius: 16px;
        font-weight: 700;
        font-size: 0.95rem;
        text-align: center;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s;
      }

      .store-toast.store-toast--show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .store-toast--ok {
        background: linear-gradient(135deg, #1a6b3c, #1e7d44);
        color: #fff;
      }

      .store-toast--err {
        background: linear-gradient(135deg, #7a1e2e, #a32940);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="store-shell">
      <p class="store-breadcrumb">
        <a href="/">← الرئيسية</a>
        ·
        <a id="browseBack" href="/stores">المتاجر</a>
        ·
        <a href="/browse">تصفح حسب النوع</a>
      </p>

      <div id="storeHeaderWrap" class="store-header-wrap" style="display: none">
        <div class="store-header">
          <div class="store-header__banner">
            <img id="storeBannerImg" src="" alt="" width="920" height="394" decoding="async" fetchpriority="high" />
          </div>
          <div class="store-header__content">
            <h1 id="storeTitle">—</h1>
            <p id="storeCategory" class="store-header__cat">—</p>
            <p id="storeDistLine" class="store-header__dist">📍 — كم</p>
            <p id="storeRatingLine" class="store-header__rating">—</p>
            <p class="sub" id="storeAddressLine" style="margin: 0 0 14px"></p>
            <button type="button" class="store-order-btn" id="orderBtn">🚚 اطلب توصيل</button>
          </div>
        </div>
      </div>

      <div class="card store-section" style="margin-bottom: 16px; padding: 18px 18px 20px">
        <div class="store-section-head">
          <h2>المنتجات</h2>
          <a href="/cart" class="store-cart-link" id="storeCartLink">🛒 السلة <span id="cartCount">0</span></a>
        </div>
        <div id="products" class="prod-grid"></div>
        <div class="row" style="margin-top: 14px; gap: 8px; flex-wrap: wrap">
          <button type="button" class="btn btn-ghost" id="btnMore" style="display: none">تحميل المزيد</button>
        </div>
      </div>

      <div class="card store-section" id="reviewCard">
        <h2 style="margin: 0 0 14px">التقييمات</h2>
        <div id="reviews"></div>
        <div id="reviewFormWrap" style="margin-top: 16px; display: none">
          <label for="ratingSel">أضف تقييماً</label>
          <select id="ratingSel">
            <option value="5">5 ★</option>
            <option value="4">4 ★</option>
            <option value="3">3 ★</option>
            <option value="2">2 ★</option>
            <option value="1">1 ★</option>
          </select>
          <label for="reviewComment" style="margin-top: 8px">تعليق (اختياري)</label>
          <textarea id="reviewComment" rows="2"></textarea>
          <button type="button" class="btn btn-primary" id="btnReview" style="margin-top: 10px">إرسال التقييم</button>
        </div>
        <p class="sub" id="reviewLoginHint" style="margin-top: 12px; display: none">
          <a href="/login?role=customer">سجّل الدخول كزائر المنصة</a> لإضافة تقييم.
        </p>
      </div>

      <div class="msg" id="msg" style="display: none"></div>
    </div>

    <div id="storeToast" class="store-toast" role="status" aria-live="polite"></div>

    <script src="/assets/cart.js"></script>
    <script src="/assets/api-config.js"></script>
    <script src="/assets/api.js"></script>
    <script>
      var params = new URLSearchParams(window.location.search);
      var storeId = params.get("id");
      var offset = 0;
      var limit = 12;
      var total = 0;
      var storeMeta = { name: "", type: "supermarket", id: "" };
      var lastProducts = [];

      var TYPE_AR = {
        restaurant: "مطعم",
        pharmacy: "صيدلية",
        supermarket: "سوبر ماركت",
        minimarket: "بقالة",
        vegetables: "خضار وفواكه",
        butcher: "لحوم",
        fish: "أسماك",
        home_business: "منتج منزلي",
        flowers_gifts: "ورد وهدايا",
        sweets: "حلويات",
        services: "خدمات",
        other: "أخرى",
        plumber: "سباكة",
        electrician: "كهرباء",
        cleaning: "تنظيف",
        nursery: "تنسيق حدائق",
        ac_technician: "تكييف",
        vehicle_transfer: "نقل مركبات",
        internal_delivery: "توصيل",
        pickup_truck: "ونيت",
        furniture_move: "نقل أثاث",
        gas_delivery: "غاز",
      };

      function typeLabelAr(type) {
        var t = String(type || "").toLowerCase();
        return TYPE_AR[t] || t || "—";
      }

      var defaultBanner =
        "data:image/svg+xml," +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="920" height="394" viewBox="0 0 920 394"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#efe6dc"/><stop offset="100%" stop-color="#e5d8cc"/></linearGradient></defs><rect fill="url(#g)" width="920" height="394"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#c9a227" font-family="sans-serif" font-size="28" font-weight="700">ERVENOW</text></svg>'
        );

      function getUserGeo() {
        return new Promise(function (resolve) {
          if (!navigator.geolocation) return resolve(null);
          navigator.geolocation.getCurrentPosition(
            function (p) {
              resolve({ lat: p.coords.latitude, lng: p.coords.longitude });
            },
            function () {
              resolve(null);
            },
            { enableHighAccuracy: false, timeout: 9000, maximumAge: 120000 }
          );
        });
      }

      var storeToastTimer = null;

      function showStoreToast(text, ok) {
        var el = document.getElementById("storeToast");
        if (!el) return;
        el.textContent = text;
        el.className = "store-toast " + (ok ? "store-toast--ok" : "store-toast--err");
        requestAnimationFrame(function () {
          el.classList.add("store-toast--show");
        });
        clearTimeout(storeToastTimer);
        storeToastTimer = setTimeout(function () {
          el.classList.remove("store-toast--show");
        }, 3200);
      }

      function addProductToCart(p, qty) {
        if (!storeId || !p) return;
        qty = Math.max(1, Math.min(99, parseInt(qty, 10) || 1));
        if (p.active === false) {
          showStoreToast("هذا المنتج غير متوفر حالياً", false);
          return;
        }
        var unit = Number(p.price) || 0;
        var title = (storeMeta.name || "متجر") + " — " + String(p.name || "منتج");
        var cart = getCart();
        var idx = cart.findIndex(function (i) {
          var d = i && i.data;
          return d && String(d.store_id) === String(storeId) && String(d.product_id) === String(p.id);
        });
        if (idx >= 0) {
          var cur = cart[idx];
          var newQty = Math.min(99, (Number(cur.data && cur.data.qty) || 1) + qty);
          cart[idx] = Object.assign({}, cur, {
            price: unit * newQty,
            data: Object.assign({}, cur.data || {}, { store_id: storeId, product_id: p.id, qty: newQty }),
          });
          saveCart(cart);
        } else {
          addToCart({
            type: storeMeta.type || "supermarket",
            title: title,
            price: unit * qty,
            data: { store_id: storeId, product_id: p.id, qty: qty },
          });
        }
        if (typeof updateCartCount === "function") updateCartCount();
        showStoreToast(idx >= 0 ? "تم تحديث الكمية في السلة" : "تمت الإضافة إلى السلة", true);
      }

      function show(text, ok) {
        var el = document.getElementById("msg");
        el.style.display = "block";
        el.className = "msg " + (ok ? "ok" : "err");
        el.textContent = text;
      }

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }

      async function loadStore() {
        if (!storeId) {
          show("معرّف المتجر غير موجود في الرابط (?id=)", false);
          return;
        }
        var geo = await getUserGeo();
        var geoQs = "";
        if (geo) {
          geoQs =
            "?user_lat=" +
            encodeURIComponent(geo.lat) +
            "&user_lng=" +
            encodeURIComponent(geo.lng);
        }
        var headers = {};
        var t = window.PlatformAPI && window.PlatformAPI.getToken && window.PlatformAPI.getToken();
        if (t) headers.Authorization = "Bearer " + t;

        var url =
          window.PlatformAPI.apiUrl("/api/store/" + encodeURIComponent(storeId) + geoQs);
        var res = await fetch(url, { headers: headers });
        var data = await res.json().catch(function () {
          return {};
        });
        if (!res.ok || !data.store) {
          show(data.error || "تعذر تحميل المتجر", false);
          return;
        }
        var store = data.store;
        storeMeta.id = store.id || storeId;
        storeMeta.name = store.name || store.label || "";
        storeMeta.type = store.type || "supermarket";

        document.getElementById("storeHeaderWrap").style.display = "block";

        var title = store.label || store.name || "متجر";
        document.getElementById("storeTitle").textContent = title;

        var cat = typeLabelAr(store.category || store.type);
        document.getElementById("storeCategory").textContent = cat;

        var distText =
          store.distance_km != null && Number.isFinite(Number(store.distance_km))
            ? "📍 " + Number(store.distance_km).toFixed(1) + " كم"
            : "📍 — كم";
        document.getElementById("storeDistLine").textContent = distText;

        var ratingLine =
          store.masked || data.browse_masked
            ? "التقييم والطلبات تظهر بالكامل بعد تسجيل الدخول."
            : "★ " +
              (Number(store.average_rating) || 0).toFixed(1) +
              " (" +
              (Number(store.rating_count) || 0) +
              " تقييم) · " +
              (Number(store.total_orders) || 0) +
              " طلب";
        document.getElementById("storeRatingLine").textContent = ratingLine;

        document.getElementById("storeAddressLine").textContent =
          store.address || store.location_text || "";

        var imgEl = document.getElementById("storeBannerImg");
        imgEl.onerror = function () {
          imgEl.onerror = null;
          imgEl.src = defaultBanner;
        };
        if (store.logo_url) {
          imgEl.src = store.logo_url;
        } else {
          imgEl.src = defaultBanner;
        }

        document.getElementById("orderBtn").onclick = function () {
          window.location.href = "/order.html?store_id=" + encodeURIComponent(storeMeta.id || storeId);
        };

        if (window.PlatformAPI && window.PlatformAPI.getToken && window.PlatformAPI.getToken()) {
          document.getElementById("reviewFormWrap").style.display = "block";
          document.getElementById("reviewLoginHint").style.display = "none";
        } else {
          document.getElementById("reviewLoginHint").style.display = "block";
        }
      }

      function renderProducts(rows, append) {
        var box = document.getElementById("products");
        rows = rows || [];
        if (!append) {
          lastProducts = rows.slice();
          box.innerHTML = "";
        } else {
          lastProducts = lastProducts.concat(rows);
        }

        if (!lastProducts.length) {
          box.innerHTML = '<p class="sub">لا منتجات بعد — يمكن الطلب العام عبر زر التوصيل أعلاه.</p>';
          return;
        }

        var html = rows
          .map(function (p) {
            var available = p.active !== false;
            var badgeOk = available ? '<span class="prod-badge prod-badge--ok">متوفر</span>' : "";
            var badgeOut = !available ? '<span class="prod-badge prod-badge--out">نفد المخزون</span>' : "";
            var im = p.image_url
              ? '<img src="' + esc(p.image_url) + '" alt="' + esc(p.name) + '" loading="lazy" decoding="async" />'
              : '<div class="prod-card__placeholder" aria-hidden="true"></div>';
            var unit = (Number(p.price) || 0).toFixed(2);
            var cardClass = "prod-card" + (available ? "" : " prod-card--unavailable");
            var rawDesc = (p.description || "").trim();
            var descBlock = rawDesc
              ? '<p class="prod-card__desc">' + esc(rawDesc) + "</p>"
              : '<p class="prod-card__desc prod-card__desc--empty">بدون وصف</p>';
            return (
              '<article class="' +
              cardClass +
              '">' +
              '<div class="prod-card__media">' +
              '<div class="prod-card__badges">' +
              badgeOut +
              badgeOk +
              "</div>" +
              im +
              "</div>" +
              '<div class="prod-card__body">' +
              '<h3 class="prod-card__title">' +
              esc(p.name) +
              "</h3>" +
              descBlock +
              '<div class="prod-card__price-row">' +
              '<div class="prod-card__price">' +
              unit +
              '<small>ريال</small></div></div>' +
              '<div class="prod-qty">' +
              '<button type="button" class="prod-qty-btn prod-qty-minus" aria-label="تقليل الكمية">−</button>' +
              '<input type="number" class="prod-qty-input" min="1" max="99" value="1" inputmode="numeric" aria-label="الكمية" />' +
              '<button type="button" class="prod-qty-btn prod-qty-plus" aria-label="زيادة الكمية">+</button>' +
              "</div>" +
              '<button type="button" class="btn-add-cart" data-pid="' +
              esc(p.id) +
              '"' +
              (available ? "" : " disabled") +
              ">إضافة للسلة</button>" +
              "</div></article>"
            );
          })
          .join("");

        if (append) box.innerHTML += html;
        else box.innerHTML = html;
      }

      document.getElementById("products").addEventListener("click", function (ev) {
        var card = ev.target.closest(".prod-card");
        var minus = ev.target.closest(".prod-qty-minus");
        var plus = ev.target.closest(".prod-qty-plus");
        if (minus || plus) {
          if (!card) return;
          ev.preventDefault();
          var qInp = card.querySelector(".prod-qty-input");
          if (!qInp) return;
          var v = parseInt(String(qInp.value), 10) || 1;
          if (minus) qInp.value = String(Math.max(1, v - 1));
          if (plus) qInp.value = String(Math.min(99, v + 1));
          return;
        }
        var btn = ev.target.closest(".btn-add-cart");
        if (!btn || btn.disabled) return;
        if (!card) return;
        var pid = btn.getAttribute("data-pid");
        var p = lastProducts.find(function (x) {
          return String(x.id) === String(pid);
        });
        var inp = card.querySelector(".prod-qty-input");
        var qty = parseInt(inp && inp.value, 10) || 1;
        addProductToCart(p, qty);
        if (inp) inp.value = "1";
      });

      async function loadProducts(append) {
        if (!storeId) return;
        var qs =
          window.PlatformAPI.apiUrl(
            "/api/store/products?store_id=" +
              encodeURIComponent(storeId) +
              "&limit=" +
              limit +
              "&offset=" +
              offset
          );
        var res = await fetch(qs);
        var data = await res.json().catch(function () {
          return {};
        });
        if (!data.products) {
          renderProducts([], append);
          return;
        }
        total = data.total || 0;
        renderProducts(data.products, append);
        offset += data.products.length;
        document.getElementById("btnMore").style.display = offset < total ? "inline-block" : "none";
      }

      async function loadReviews() {
        if (!storeId) return;
        var res = await fetch(
          window.PlatformAPI.apiUrl("/api/store/reviews?store_id=" + encodeURIComponent(storeId) + "&limit=30")
        );
        var data = await res.json().catch(function () {
          return {};
        });
        var box = document.getElementById("reviews");
        var rows = data.reviews || [];
        if (!rows.length) {
          box.innerHTML = '<p class="sub">لا تقييمات بعد</p>';
          return;
        }
        box.innerHTML = rows
          .map(function (r) {
            return (
              '<div class="card" style="padding:12px;margin-bottom:8px;border-radius:14px">' +
              "<strong>★ " +
              esc(r.rating) +
              "</strong>" +
              '<p class="sub" style="margin:6px 0 0">' +
              esc(r.comment || "—") +
              "</p></div>"
            );
          })
          .join("");
      }

      document.getElementById("btnMore").onclick = function () {
        loadProducts(true);
      };

      document.getElementById("btnReview").onclick = async function () {
        try {
          var rating = Number(document.getElementById("ratingSel").value);
          var comment = document.getElementById("reviewComment").value.trim();
          await window.PlatformAPI.api("/api/store/reviews", {
            method: "POST",
            body: { store_id: storeId, rating: rating, comment: comment || undefined },
          });
          show("شكراً — تم حفظ التقييم", true);
          document.getElementById("reviewComment").value = "";
          await loadStore();
          await loadReviews();
        } catch (e) {
          show(String(e.message || e), false);
        }
      };

      (async function () {
        try {
          var bt = sessionStorage.getItem("ervenow_browse_type");
          if (bt) {
            document.getElementById("browseBack").href = "/browse?type=" + encodeURIComponent(bt);
          }
        } catch (e) {}
        try {
          await loadStore();
          offset = 0;
          await loadProducts(false);
          await loadReviews();
        } catch (e) {
          show(String(e.message || e), false);
        }
      })();
    </script>
  </body>
</html>
