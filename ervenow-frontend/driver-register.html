<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ERVENOW | تسجيل مندوب</title>
    <script>
      (function () {
        var qs = new URLSearchParams(location.search);
        qs.set("mode", "register");
        qs.set("role", "driver");
        location.replace("/login?" + qs.toString());
      })();
    </script>
    <meta http-equiv="refresh" content="0;url=/login?mode=register&role=driver" />
  </head>
  <body>
    <p><a href="/login?mode=register&role=driver">متابعة إلى بوابة الدخول</a></p>
  </body>
</html>
