<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ERVENOW | طلبات المنصة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/guest-shell.css" />
    <link rel="stylesheet" href="/assets/driver-shell.css" />
    <style>
      /* صفحة طلبات المنصة: ترتيب عمودي متسق لكل الشاشات */
      .driver-orders-layout {
        display: flex !important;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: min(820px, 100%);
        margin-inline: auto;
        align-items: center;
      }

      .driver-orders-layout > * {
        width: 100%;
      }

      .driver-orders-page .guest-section-hero__inner {
        text-align: center;
      }

      .driver-orders-profile {
        margin-bottom: 0;
      }

      .driver-orders-profile .driver-profile-card__row {
        justify-content: center;
      }

      .driver-orders-profile .driver-profile-card__avatar {
        width: clamp(54px, 15vw, 64px);
        height: clamp(54px, 15vw, 64px);
        font-size: clamp(1.5rem, 4.8vw, 2rem);
      }

      .driver-orders-profile .driver-profile-card__phone {
        margin-top: 8px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.72);
        border-radius: 10px;
        text-align: center;
      }

      .driver-orders-profile .driver-profile-card__meta {
        text-align: center;
      }

      .driver-orders-profile .driver-profile-card__role {
        margin-inline: auto;
      }

      .drv-orders-toolbar {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .driver-orders-balance {
        margin: 0;
        min-height: 46px;
        justify-content: center;
      }

      .driver-orders-refresh {
        margin: 0;
        width: 100%;
        min-height: 46px;
      }

      #msg.drv-alert {
        display: none;
        margin-top: 0;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(185, 135, 47, 0.12);
        border: 1px solid rgba(185, 135, 47, 0.28);
        color: var(--brown, #3d2213);
        font-weight: 600;
        text-align: center;
      }

      .driver-orders-layout .driver-panel-card > .badge,
      .driver-orders-layout .drv-section-hint,
      .driver-orders-layout .drv-empty-state {
        text-align: center;
      }

      @media (min-width: 640px) {
        .drv-orders-toolbar {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body class="guest-shell-page driver-page driver-orders-page">
    <div id="driverShellHeader"></div>
    <div class="dash-main">
      <div id="driverShellHero"></div>
      <div class="layout driver-orders-layout">
        <div class="card driver-profile-card driver-orders-profile">
          <div class="driver-profile-card__row">
            <span class="driver-profile-card__avatar" aria-hidden="true">📋</span>
            <div class="driver-profile-card__meta">
              <span class="driver-profile-card__role">طلبات المنصة</span>
              <p class="driver-profile-card__phone" id="phoneLine" translate="no">—</p>
            </div>
          </div>
          <div class="drv-orders-toolbar">
            <a class="driver-profile-card__wallet driver-orders-balance" href="/driver-wallet">
              <span class="driver-profile-card__wallet-ic" aria-hidden="true">💳</span>
              <span class="driver-profile-card__wallet-label">الرصيد والسحب</span>
              <span class="driver-profile-card__wallet-arrow" aria-hidden="true">←</span>
            </a>
            <button type="button" class="driver-refresh-btn driver-orders-refresh" id="refreshBtn">تحديث</button>
          </div>
        </div>

        <div class="card driver-panel-card" id="secAvailable">
          <div class="badge">الطلبات المتاحة</div>
          <div class="driver-panel-card__body">
            <p class="drv-section-hint" id="summaryAvailable">—</p>
            <div id="cardsAvailable"></div>
          </div>
        </div>

        <div class="card driver-panel-card" id="secMine">
          <div class="badge">طلباتي النشطة</div>
          <div class="driver-panel-card__body">
            <p class="drv-section-hint" id="summaryMine">—</p>
            <div id="cardsMine"></div>
          </div>
        </div>

        <div id="msg" class="drv-alert"></div>
      </div>
      <div id="driverShellFooter"></div>
    </div>

    <audio id="newOrderSound" src="/sound.mp3" preload="auto"></audio>

    <script src="/assets/api-config.js"></script>
    <script src="/assets/api.js"></script>
    <script src="/assets/driver-nav.js"></script>
    <script>
      ErvenowDriverNav.mount({
        activeNav: "orders",
        hero: {
          title: "طلبات المنصة",
          sub: "",
        },
      });
    </script>
    <script>
      var token = window.PlatformAPI.getToken();
      var meUser = null;
      var lastPendingCount = 0;
      var pollTimer = null;
      var activeOrderIds = [];
      var locationTimer = null;
      var notifAsked = false;

      function showMsg(t) {
        var el = document.getElementById("msg");
        el.style.display = "block";
        el.textContent = t;
      }

      function haversineKm(lat1, lng1, lat2, lng2) {
        var R = 6371;
        var dLat = ((lat2 - lat1) * Math.PI) / 180;
        var dLng = ((lng2 - lng1) * Math.PI) / 180;
        var a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dLng / 2) *
            Math.sin(dLng / 2);
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function orderKm(o) {
        var dk = Number(o.distance_km);
        if (Number.isFinite(dk) && dk > 0) return Math.round(dk * 10) / 10;
        var a = Number(o.pickup_lat),
          b = Number(o.pickup_lng),
          c = Number(o.drop_lat),
          d = Number(o.drop_lng);
        if (Number.isFinite(a) && Number.isFinite(b) && Number.isFinite(c) && Number.isFinite(d)) {
          return Math.round(haversineKm(a, b, c, d) * 10) / 10;
        }
        return null;
      }

      function orderFee(o) {
        return Math.round((Number(o.delivery_fee) || 0) * 100) / 100;
      }

      function orderNo(o) {
        return (o.order_number && String(o.order_number).trim()) || String(o.id).slice(0, 8) + "…";
      }

      function routeToMaps(order) {
        var dest = "";
        if (order.drop_lat != null && order.drop_lng != null) {
          dest = String(order.drop_lat) + "," + String(order.drop_lng);
        } else {
          dest = String(order.drop_address || "");
        }
        if (!dest) return;
        var url = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(dest);
        window.open(url, "_blank", "noopener,noreferrer");
      }

      function playNewOrderSound() {
        var snd = document.getElementById("newOrderSound");
        if (!snd || typeof snd.play !== "function") return;
        try {
          snd.currentTime = 0;
          snd.play().catch(function () {});
        } catch (e) {}
      }

      function notifyBrowserNewOrder(count) {
        if (!("Notification" in window)) return;
        if (Notification.permission === "granted") {
          try {
            new Notification("ERVENOW", {
              body: "طلب جديد في المنصة — المتاح الآن: " + count,
              tag: "ervenow-order",
            });
          } catch (e) {}
          return;
        }
        if (!notifAsked && Notification.permission === "default") {
          notifAsked = true;
          Notification.requestPermission().then(function (p) {
            if (p === "granted") notifyBrowserNewOrder(count);
          });
        }
      }

      async function acceptOrder(order) {
        try {
          var j = await window.PlatformAPI.api("/api/driver/accept/" + encodeURIComponent(order.id), {
            method: "POST",
          });
          if (j.accepted === false) {
            showMsg(j.message || "تم استلام الطلب من مندوب آخر");
            await loadOrders();
            return;
          }
          await loadOrders();
        } catch (e) {
          showMsg(e.message || String(e));
        }
      }

      async function startDelivery(order) {
        try {
          await window.PlatformAPI.api("/api/driver/start-delivery/" + encodeURIComponent(order.id), {
            method: "POST",
          });
          await sendLocationToActiveOrders();
          await loadOrders();
        } catch (e) {
          showMsg(e.message || String(e));
        }
      }

      async function completeOrder(order) {
        try {
          await window.PlatformAPI.api("/api/driver/complete-order/" + encodeURIComponent(order.id), {
            method: "POST",
          });
          await loadOrders();
        } catch (e) {
          showMsg(e.message || String(e));
        }
      }

      async function sendLocationToActiveOrders() {
        if (!activeOrderIds.length) return;
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            activeOrderIds.forEach(function (id) {
              window.PlatformAPI.api("/api/driver/update-location", {
                method: "POST",
                body: { order_id: id, lat: lat, lng: lng },
              }).catch(function () {});
            });
          },
          function () {},
          { enableHighAccuracy: false, maximumAge: 8000, timeout: 10000 }
        );
      }

      function startLocationLoop() {
        if (locationTimer) clearInterval(locationTimer);
        locationTimer = setInterval(function () {
          sendLocationToActiveOrders();
        }, 5000);
      }

      function stopLocationLoop() {
        if (locationTimer) {
          clearInterval(locationTimer);
          locationTimer = null;
        }
      }

      function splitOrders(visible, meId) {
        var available = [];
        var mine = [];
        (visible || []).forEach(function (o) {
          var ds = String(o.delivery_status || o.status || "").toLowerCase();
          var open = (ds === "new" || ds === "pending") && !o.driver_id;
          if (open) {
            available.push(o);
            return;
          }
          if (o.driver_id && meId && String(o.driver_id) === String(meId)) {
            mine.push(o);
          }
        });
        return { available: available, mine: mine };
      }

      var STATUS_AR_ORDERS = {
        new: "جديد",
        pending: "بانتظار مندوب",
        accepted: "مقبول",
        delivering: "جاري التوصيل",
        delivered: "تم التسليم",
      };

      function renderOrderRows(orders, mode) {
        if (!orders.length) {
          return { cards: '<div class="drv-empty-state">لا توجد طلبات في هذا القسم.</div>' };
        }
        var cards = "";
        orders.forEach(function (o) {
          var ds = String(o.delivery_status || o.status || "").toLowerCase();
          var km = orderKm(o);
          var kmStr = km != null ? km + " كم" : "—";
          var feeStr = orderFee(o).toFixed(2) + " ر.س";
          var stLabel = STATUS_AR_ORDERS[ds] || ds;

          var body =
            "<p><strong>المسافة:</strong> " + kmStr + " · <strong>الأجرة:</strong> " + feeStr + "</p>";
          if (o.drop_address) body += "<p>📍 " + ErvenowDriverNav.escHtml(o.drop_address) + "</p>";

          var actionsHtml = "";
          if (mode === "available") {
            actionsHtml =
              '<button type="button" class="drv-btn drv-btn--gold btn-accept" data-id="' +
              encodeURIComponent(o.id) +
              '">قبول الطلب</button>';
          } else {
            if (ds === "accepted") {
              actionsHtml +=
                '<button type="button" class="drv-btn drv-btn--gold btn-start" data-id="' +
                encodeURIComponent(o.id) +
                '">بدء التوصيل</button>';
            }
            if (ds === "accepted" || ds === "delivering") {
              actionsHtml +=
                '<button type="button" class="drv-btn drv-btn--ghost btn-done" data-id="' +
                encodeURIComponent(o.id) +
                '">تم التسليم</button>';
            }
            actionsHtml +=
              '<a class="drv-btn drv-btn--ghost" href="/driver-app?order=' +
              encodeURIComponent(o.id) +
              '#track">تتبع الحي</a>' +
              '<button type="button" class="drv-btn drv-btn--ghost btn-map" data-id="' +
              encodeURIComponent(o.id) +
              '">خريطة</button>';
          }

          cards += ErvenowDriverNav.orderCardHtml(o, {
            statusLabel: stLabel,
            bodyHtml: body,
            actionsHtml: actionsHtml,
          });
        });
        return { cards: cards };
      }

      function wireOrderButtons(cardsEl, orders, mode) {
        function findOrder(id) {
          var u = decodeURIComponent(id);
          for (var i = 0; i < orders.length; i++) {
            if (String(orders[i].id) === u) return orders[i];
          }
          return null;
        }
        function bind(container) {
          if (!container) return;
          container.querySelectorAll(".btn-accept").forEach(function (btn) {
            btn.onclick = function () {
              var id = btn.getAttribute("data-id");
              var o = findOrder(id);
              if (o) acceptOrder(o);
            };
          });
          container.querySelectorAll(".btn-start").forEach(function (btn) {
            btn.onclick = function () {
              var o = findOrder(btn.getAttribute("data-id"));
              if (o) startDelivery(o);
            };
          });
          container.querySelectorAll(".btn-done").forEach(function (btn) {
            btn.onclick = function () {
              var o = findOrder(btn.getAttribute("data-id"));
              if (o) completeOrder(o);
            };
          });
          container.querySelectorAll(".btn-map").forEach(function (btn) {
            btn.onclick = function () {
              var o = findOrder(btn.getAttribute("data-id"));
              if (o) routeToMaps(o);
            };
          });
        }
        bind(cardsEl);
      }

      function renderOrders(visible) {
        var meId = meUser && meUser.id;
        var sp = splitOrders(visible, meId);
        var av = sp.available;
        var mine = sp.mine;

        document.getElementById("summaryAvailable").textContent =
          "المتاحة للقبول: " + av.length + (av.length ? "" : " — لا توجد طلبات مفتوحة حالياً");
        document.getElementById("summaryMine").textContent =
          mine.length ? "عدد طلباتك الجارية: " + mine.length : "لا توجد طلبات مسندة إليك حالياً";

        var ra = renderOrderRows(av, "available");
        var ca = document.getElementById("cardsAvailable");
        ca.innerHTML = ra.cards;

        var rm = renderOrderRows(mine, "mine");
        var cm = document.getElementById("cardsMine");
        cm.innerHTML = rm.cards;

        wireOrderButtons(ca, av, "available");
        wireOrderButtons(cm, mine, "mine");
      }

      async function loadOrders() {
        try {
          var j = await window.PlatformAPI.api("/api/delivery/orders");
          var all = j.orders || [];
          var visible = all.filter(function (o) {
            var ds = String(o.delivery_status || o.status || "").toLowerCase();
            if (!["new", "pending", "accepted", "delivering"].includes(ds)) return false;
            if (!o.driver_id) return true;
            return meUser && String(o.driver_id) === String(meUser.id);
          });

          var pendingCount = visible.filter(function (o) {
            var ds = String(o.delivery_status || o.status || "").toLowerCase();
            return (ds === "pending" || ds === "new") && !o.driver_id;
          }).length;

          if (pendingCount > lastPendingCount) {
            playNewOrderSound();
            notifyBrowserNewOrder(pendingCount);
          }
          lastPendingCount = pendingCount;

          activeOrderIds = visible
            .filter(function (o) {
              var ds = String(o.delivery_status || o.status || "").toLowerCase();
              return (
                o.driver_id &&
                meUser &&
                String(o.driver_id) === String(meUser.id) &&
                (ds === "accepted" || ds === "delivering")
              );
            })
            .map(function (o) {
              return o.id;
            });

          renderOrders(visible);
        } catch (e) {
          showMsg(e.message || "تعذّر تحميل الطلبات");
        }
      }

      async function init() {
        if (!token) {
          document.body.innerHTML =
            '<div style="text-align:center;margin-top:50px;font-family:Cairo,sans-serif">' +
            "<h2>الرجاء تسجيل الدخول كمندوب</h2>" +
            '<a href="/driver-login">تسجيل الدخول</a>' +
            "</div>";
          return;
        }

        try {
          var me = await window.PlatformAPI.api("/api/core/me");
          meUser = me.user || {};
          var role = me.profile && me.profile.role;
          if (role !== "driver" && role !== "admin") {
            showMsg("طابور طلبات المندوبين غير متاح — تابع طلباتك من لوحة الزائر أو التتبع.");
            setTimeout(function () {
              location.replace("/dashboard");
            }, 2200);
            return;
          }
          var phone = meUser.phone || (me.profile && me.profile.name) || meUser.id || "—";
          document.getElementById("phoneLine").textContent = phone;

          await loadOrders();
          pollTimer = setInterval(loadOrders, 6000);
          startLocationLoop();
          sendLocationToActiveOrders();
        } catch (e) {
          showMsg(e.message || "فشل التحقق من الحساب");
        }
      }

      document.getElementById("refreshBtn").addEventListener("click", function () {
        try {
          var snd = document.getElementById("newOrderSound");
          if (snd) {
            snd.currentTime = 0;
            snd.play().catch(function () {});
          }
        } catch (e) {}
        loadOrders();
      });

      init();
    </script>
  </body>
</html>
