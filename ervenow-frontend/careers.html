<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <script src="/assets/viewport-fit.js?erv=20260612"></script>
    <title>ERVENOW | بوابة التوظيف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/guest-shell.css?erv=20260612" />
  </head>
  <body class="guest-shell-page">
    <header class="dash-site-header">
      <div class="dash-site-header__inner">
        <div class="dash-site-header__brand">
          <a class="dash-site-header__logo" href="/">
            ERVENOW
            <span class="dash-site-header__logo-dot" aria-hidden="true"></span>
          </a>
          <p class="dash-site-header__tag" id="guestShellPageTag">الوظائف</p>
        </div>
        <nav class="dash-site-header__nav" aria-label="التنقل الرئيسي">
          <div class="dash-site-header__links">
            <a class="dash-site-header__link" href="/dashboard" data-nav="guest">منصة ERVENOW</a>
            <a class="dash-site-header__link" href="/restaurants" data-nav="restaurants">مطاعم</a>
            <a class="dash-site-header__link" href="/stores" data-nav="stores">متاجر</a>
            <a class="dash-site-header__link" href="/delivery-services.html" data-nav="delivery">توصيل</a>
            <a class="dash-site-header__link" href="/services" data-nav="services">خدمات</a>
            <a class="dash-site-header__link is-active" href="/" data-nav="home" aria-current="page">الرئيسية</a>
          </div>
        </nav>
        <div class="dash-site-header__tools">
          <a class="dash-header-wallet" id="dashHeaderWallet" href="/wallet.html" hidden aria-label="المحفظة">
            <span class="dash-header-wallet__label">محفظة</span>
            <span class="dash-header-wallet__val" id="dashHeaderWalletAmount">—</span>
            <span class="dash-header-wallet__cur">ر.س</span>
          </a>
          <a class="dash-header-cart" href="/checkout" aria-label="السلة — الدفع">
            <span aria-hidden="true">🛒</span>
            <span class="dash-header-cart__label">السلة</span>
            <span class="dash-header-cart__badge" id="cartCount" data-empty="true">0</span>
          </a>
        </div>
        <a class="dash-site-header__btn dash-site-header__btn--primary" href="/login?role=customer" id="switchAccount">دخول الأعضاء</a>
      </div>
    </header>

    <div class="dash-main">
      <div class="layout">
        <h1 class="guest-page-title">بوابة التوظيف</h1>
        <p class="sub">قدّم طلبك وسيتم مراجعته من إدارة المنصة.</p>

        <div class="card">
          <label for="name">الاسم</label>
          <input id="name" type="text" />
          <label for="phone">رقم الجوال</label>
          <input id="phone" type="tel" inputmode="numeric" placeholder="05xxxxxxxx" />
          <label for="city">المدينة</label>
          <input id="city" type="text" />
          <label for="roleWanted">الوظيفة المطلوبة</label>
          <input id="roleWanted" type="text" placeholder="مندوب / دعم / عمليات ..." />
          <label for="note">نبذة</label>
          <textarea id="note" rows="4" placeholder="خبراتك ومعلومات إضافية"></textarea>
          <div class="btn-row">
            <button type="button" class="btn btn-primary" id="sendBtn">إرسال الطلب</button>
          </div>
          <div id="msg" class="sub" style="margin-top:8px"></div>
        </div>
      </div>

      </div>

    <script src="/assets/order-draft-store.js"></script>
    <script src="/assets/order-draft-badge.js"></script>
    <script src="/assets/api-config.js"></script>
    <script src="/assets/api.js?erv=20260612"></script>
    <script src="/assets/guestBrowse.js"></script>
    <script src="/assets/guest-shell.js?erv=20260612"></script>
    <script>
      ErvenowGuestShell.init({ activeNav: "home", pageTag: "الوظائف" });
    </script>
    <script>
      function normalizePhone(v) {
        var d = String(v || "").replace(/\D/g, "");
        if (d.startsWith("9665")) d = "0" + d.slice(3);
        if (d.startsWith("5") && d.length === 9) d = "0" + d;
        return d.slice(0, 10);
      }
      function is05(v) {
        return /^05\d{8}$/.test(String(v || ""));
      }
      document.getElementById("sendBtn").onclick = async function () {
        var msg = document.getElementById("msg");
        try {
          var name = String(document.getElementById("name").value || "").trim();
          var phone = normalizePhone(document.getElementById("phone").value);
          var city = String(document.getElementById("city").value || "").trim();
          var roleWanted = String(document.getElementById("roleWanted").value || "").trim();
          var note = String(document.getElementById("note").value || "").trim();
          if (!name) return (msg.textContent = "الاسم مطلوب");
          if (!is05(phone)) return (msg.textContent = "رقم الجوال غير صالح");
          await window.PlatformAPI.api("/api/admin/job-applications/public", {
            method: "POST",
            body: { name: name, phone: phone, city: city, role_wanted: roleWanted, note: note },
          });
          msg.textContent = "تم إرسال طلب التوظيف بنجاح.";
          document.getElementById("name").value = "";
          document.getElementById("phone").value = "";
          document.getElementById("city").value = "";
          document.getElementById("roleWanted").value = "";
          document.getElementById("note").value = "";
        } catch (e) {
          msg.textContent = e.message || "تعذر إرسال الطلب";
        }
      };
    </script>
  </body>
</html>
