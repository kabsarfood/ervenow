<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#2b170d" />
    <title>لوحة التحكم | ERVENOW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --gold: #d4a84b;
        --gold-light: #f5e6b8;
        --brown: #3d2213;
        --brown-deep: #1f1209;
        --touch: 52px;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html {
        font-size: clamp(15px, 2.8vw, 18px);
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: Cairo, system-ui, sans-serif;
        color: var(--brown);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(16px + var(--safe-t)) max(16px, env(safe-area-inset-left, 16px))
          calc(20px + var(--safe-b)) max(16px, env(safe-area-inset-right, 16px));
        background:
          radial-gradient(ellipse 120% 80% at 50% -20%, rgba(212, 168, 75, 0.28), transparent 55%),
          radial-gradient(ellipse 90% 60% at 100% 100%, rgba(61, 34, 19, 0.5), transparent 50%),
          linear-gradient(165deg, #1a0f08 0%, #2b170d 38%, #4a2e1a 72%, #3d2213 100%);
      }
      .admin-login-scene {
        width: 100%;
        max-width: 440px;
        margin: auto;
      }
      .admin-login-card {
        position: relative;
        border-radius: 24px;
        overflow: hidden;
        background: linear-gradient(155deg, #fffefb 0%, #faf3e8 48%, #f0e4d4 100%);
        box-shadow:
          0 4px 0 rgba(212, 168, 75, 0.45),
          0 28px 64px rgba(0, 0, 0, 0.38);
        outline: 1px solid rgba(212, 168, 75, 0.35);
      }
      .admin-login-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 2px;
        background: linear-gradient(135deg, #f5e6b8, #d4a84b 40%, #8f6420 100%);
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
      .admin-login-card__ribbon {
        height: 7px;
        background: linear-gradient(90deg, #8f6420, #d4a84b 35%, #f5e6b8 50%, #d4a84b 65%, #8f6420);
      }
      .admin-login-card__body {
        padding: clamp(22px, 5vw, 28px) clamp(20px, 4.5vw, 26px) clamp(24px, 5vw, 30px);
      }
      .admin-login-card__brand {
        text-align: center;
        margin-bottom: 20px;
      }
      .admin-login-card__seal {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        margin-bottom: 12px;
        border-radius: 20px;
        font-size: 2rem;
        background: linear-gradient(145deg, #f5e6b8, #d4a84b 55%, #8f6420);
        border: 2px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          0 10px 28px rgba(139, 100, 32, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
      }
      .admin-login-card__logo {
        margin: 0;
        font-size: clamp(1.2rem, 4vw, 1.4rem);
        font-weight: 900;
        letter-spacing: 0.12em;
        color: var(--brown);
      }
      .admin-login-card__tag {
        margin: 6px 0 0;
        font-size: 0.88rem;
        font-weight: 800;
        color: #8f6420;
      }
      .admin-login-card__title {
        margin: 0 0 8px;
        font-size: 1.15rem;
        font-weight: 900;
        color: var(--brown);
        text-align: center;
      }
      .admin-login-card__hint {
        margin: 0 0 18px;
        font-size: 0.88rem;
        font-weight: 600;
        line-height: 1.6;
        color: #5c4a3d;
        text-align: center;
      }
      .admin-login-card__hint strong {
        color: var(--brown);
      }
      .admin-field {
        margin-bottom: 14px;
      }
      .admin-field label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.8rem;
        font-weight: 800;
        color: #6b4528;
      }
      .admin-field input {
        width: 100%;
        min-height: var(--touch);
        padding: 0 14px;
        border-radius: 14px;
        border: 1px solid rgba(61, 34, 19, 0.14);
        background: rgba(255, 255, 255, 0.85);
        font-family: inherit;
        font-size: 1.02rem;
        font-weight: 700;
        color: var(--brown);
        box-shadow: inset 0 1px 3px rgba(45, 26, 14, 0.06);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .admin-field input:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow:
          0 0 0 3px rgba(212, 168, 75, 0.22),
          inset 0 1px 3px rgba(45, 26, 14, 0.06);
      }
      .auth-code-group[hidden] {
        display: none !important;
      }
      .admin-login-card__actions {
        margin-top: 18px;
      }
      .admin-btn-primary {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: var(--touch);
        border: none;
        border-radius: 14px;
        font-family: inherit;
        font-size: 1.02rem;
        font-weight: 900;
        color: #fff8e8;
        cursor: pointer;
        background: linear-gradient(135deg, #3d2213 0%, #5a3820 45%, #3d2213 100%);
        border: 1px solid rgba(245, 230, 184, 0.3);
        box-shadow:
          0 6px 20px rgba(45, 26, 14, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        transition: filter 0.15s, transform 0.12s;
      }
      .admin-btn-primary:hover {
        filter: brightness(1.06);
      }
      .admin-btn-primary:active {
        transform: scale(0.99);
      }
      .admin-btn-primary:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }
      .admin-login-card__foot {
        margin-top: 16px;
        text-align: center;
      }
      .admin-login-card__foot a {
        font-size: 0.84rem;
        font-weight: 700;
        color: #8f6420;
        text-decoration: none;
      }
      .admin-login-card__foot a:hover {
        text-decoration: underline;
      }
      #msg {
        margin: 14px 0 0;
        min-height: 1.3em;
        font-size: 0.88rem;
        font-weight: 700;
        line-height: 1.5;
        text-align: center;
        color: #5c4a3d;
      }
      #msg.err {
        color: #b91c1c;
      }
      #msg.ok {
        color: #15803d;
      }
      .auth-dev-panel {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px dashed rgba(212, 168, 75, 0.5);
        background: rgba(255, 255, 255, 0.06);
      }
      .auth-dev-panel__label {
        margin: 0 0 4px;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        color: var(--gold-light);
      }
      .auth-dev-panel__hint {
        margin: 0 0 10px;
        font-size: 0.78rem;
        font-weight: 600;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.72);
      }
      .auth-dev-direct {
        display: block;
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(212, 168, 75, 0.65);
        background: linear-gradient(180deg, rgba(212, 168, 75, 0.22), rgba(212, 168, 75, 0.1));
        color: #fffef8;
        font-family: inherit;
        font-size: 0.92rem;
        font-weight: 900;
        cursor: pointer;
      }
      .auth-dev-direct:hover {
        background: rgba(212, 168, 75, 0.32);
      }
      .auth-portal-nav {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid rgba(212, 168, 75, 0.22);
      }
      .auth-portal-nav__title {
        margin: 0 0 10px;
        text-align: center;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.72);
      }
      .auth-portal-nav__grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      @media (min-width: 420px) {
        .auth-portal-nav__grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .auth-portal-nav__link {
        display: block;
        padding: 9px 8px;
        border-radius: 11px;
        border: 1px solid rgba(212, 168, 75, 0.35);
        background: rgba(255, 255, 255, 0.08);
        color: #fffef8;
        font-size: 0.78rem;
        font-weight: 800;
        line-height: 1.35;
        text-align: center;
        text-decoration: none;
      }
      .auth-portal-nav__link:hover {
        background: rgba(212, 168, 75, 0.22);
        border-color: rgba(212, 168, 75, 0.55);
      }
      .auth-portal-nav__link.is-current {
        background: linear-gradient(135deg, rgba(212, 168, 75, 0.35), rgba(212, 168, 75, 0.18));
        border-color: rgba(245, 230, 184, 0.65);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main class="admin-login-scene" aria-label="دخول لوحة التحكم">
      <article class="admin-login-card">
        <div class="admin-login-card__ribbon" aria-hidden="true"></div>
        <div class="admin-login-card__body">
          <header class="admin-login-card__brand">
            <div class="admin-login-card__seal" aria-hidden="true">🔐</div>
            <p class="admin-login-card__logo">ERVENOW</p>
            <p class="admin-login-card__tag">لوحة التحكم</p>
          </header>

          <h1 class="admin-login-card__title">تسجيل دخول الإدارة</h1>
          <p class="admin-login-card__hint" id="adminAuthIntro">
            أدخل الجوال المصرّح ثم اضغط إرسال رمز واتساب. صلاحية الرمز <strong>5 دقائق</strong>.
          </p>

          <div class="admin-field">
            <label for="phone">رقم الجوال</label>
            <input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="12" placeholder="05xxxxxxxx أو 9665xxxxxxxx" dir="ltr" />
          </div>

          <div class="auth-code-group" id="adminCodeGroup" hidden>
            <div class="admin-field">
              <label for="code">رمز واتساب</label>
              <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="رمز التحقق" dir="ltr" />
            </div>
          </div>

          <div class="admin-login-card__actions">
            <button class="admin-btn-primary" id="adminAuthBtn" type="button">إرسال رمز واتساب</button>
          </div>

          <p id="msg" role="status" aria-live="polite"></p>

          <nav class="auth-portal-nav" aria-label="بوابات الدخول">
            <p class="auth-portal-nav__title">دخول بوابة أخرى</p>
            <div class="auth-portal-nav__grid">
              <a class="auth-portal-nav__link" href="/login?role=customer">👤 دخول الزائر</a>
              <a class="auth-portal-nav__link" href="/login?role=merchant">🏪 دخول التاجر</a>
              <a class="auth-portal-nav__link" href="/login?role=service">🔧 مقدّم الخدمة</a>
              <a class="auth-portal-nav__link" href="/driver-login">🚗 دخول المندوب</a>
              <a class="auth-portal-nav__link is-current" href="/admin-login" aria-current="page">🔐 دخول الإدارة</a>
              <a class="auth-portal-nav__link" href="/dashboard">🗺️ لوحة الزائر</a>
            </div>
          </nav>

          <footer class="admin-login-card__foot">
            <a href="/">← العودة للرئيسية</a>
          </footer>
        </div>
      </article>
    </main>

    <script src="/assets/api-config.js"></script>
    <script>
      window.__ERVENOW_FETCH_TIMEOUT_MS = 20000;
    </script>
    <script src="/assets/api.js"></script>
    <script src="/assets/sa-phone-input.js"></script>
    <script src="/assets/auth-otp-flow.js"></script>
    <script>
      function getAnyToken() {
        return (
          localStorage.getItem("ervenow_access_token") ||
          localStorage.getItem("erwenow_access_token") ||
          localStorage.getItem("token") ||
          ""
        );
      }

      (function redirectIfAdminSession() {
        if (!getAnyToken()) return;
        fetch(window.PlatformAPI.apiUrl("/api/core/me"), {
          headers: { Authorization: "Bearer " + getAnyToken() },
        })
          .then(function (r) {
            return r.json().then(function (d) {
              return { ok: r.ok, d: d };
            });
          })
          .then(function (x) {
            var role = x.d && x.d.profile && x.d.profile.role;
            if (x.ok && String(role || "").toLowerCase() === "admin") {
              window.location.replace("/admin-dashboard");
            }
          })
          .catch(function () {});
      })();

      function normalizeAdminPhone(v) {
        if (window.ErvenowSaPhone) {
          var el = document.getElementById("phone");
          if (el) ErvenowSaPhone.formatField(el);
          return ErvenowSaPhone.toLocal05(el ? el.value : v);
        }
        var d = String(v || "").replace(/\D/g, "");
        if (d.startsWith("9665") && d.length === 12) return "0" + d.slice(3);
        if (d.startsWith("5") && d.length === 9) return "0" + d;
        return d.slice(0, 10);
      }

      function isValid05(v) {
        return window.ErvenowSaPhone ? ErvenowSaPhone.isValid(v) : /^05\d{8}$/.test(normalizeAdminPhone(v));
      }

      function setMsg(text, kind) {
        var el = document.getElementById("msg");
        el.classList.remove("err", "ok");
        if (kind === "err") el.classList.add("err");
        else if (kind === "ok") el.classList.add("ok");
        el.textContent = text || "";
      }

      function mapOtpError(msg) {
        var m = String(msg || "");
        if (m.indexOf("منتهي") !== -1 || m.indexOf("غير صحيح") !== -1) {
          return "رمز واتساب غير صحيح أو منتهي. صلاحية الرمز 5 دقائق.";
        }
        return m;
      }

      function phoneToE164(phoneEl) {
        if (window.ErvenowSaPhone) {
          ErvenowSaPhone.formatField(phoneEl);
          var e164 = ErvenowSaPhone.toE164(phoneEl.value);
          if (e164) phoneEl.value = ErvenowSaPhone.toLocal05(phoneEl.value);
          return e164 || "";
        }
        var phone = normalizeAdminPhone(phoneEl.value || "");
        phoneEl.value = phone;
        return "+966" + phone.slice(1);
      }

      ErvenowAuthOtpFlow.mount({
        phoneId: "phone",
        codeId: "code",
        codeGroupId: "adminCodeGroup",
        btnId: "adminAuthBtn",
        introId: "adminAuthIntro",
        introSend: "أدخل الجوال المصرّح ثم اضغط إرسال رمز واتساب. صلاحية الرمز 5 دقائق.",
        introVerify: "أدخل رمز واتساب ثم اضغط دخول لوحة التحكم.",
        labels: {
          send: "إرسال رمز واتساب",
          verify: "دخول لوحة التحكم",
        },
        phoneValid: function (v) {
          return isValid05(v);
        },
        normalizePhone: function (phoneEl) {
          phoneEl.value = normalizeAdminPhone(phoneEl.value);
          return phoneEl.value;
        },
        onPhoneInvalid: function () {
          setMsg(ErvenowSaPhone ? ErvenowSaPhone.invalidMessage() : "أدخل رقم سعودي صحيح", "err");
        },
        onVerifyNeedsCode: function (codeEl) {
          if (!(codeEl.value || "").trim()) {
            setMsg("أدخل رمز واتساب", "err");
            return false;
          }
          return true;
        },
        onSend: async function (phoneEl) {
          setMsg("", "");
          var e164 = phoneToE164(phoneEl);
          try {
            var j = await window.PlatformAPI.api("/api/core/send-otp", {
              method: "POST",
              body: { phone: e164, role: "admin" },
            });
            if (!j || j.ok === false) throw new Error((j && j.error) || "تعذر إرسال الرمز");
            setMsg("تم إرسال رمز واتساب. صلاحية الرمز 5 دقائق.", "ok");
          } catch (e) {
            setMsg(mapOtpError(e.message || "فشل الإرسال"), "err");
            throw e;
          }
        },
        onVerify: async function (phoneEl, codeEl) {
          setMsg("", "");
          var e164 = phoneToE164(phoneEl);
          var code = (codeEl.value || "").trim();
          if (!isValid05(normalizeAdminPhone(phoneEl.value))) {
            setMsg(ErvenowSaPhone ? ErvenowSaPhone.invalidMessage() : "أدخل رقم سعودي صحيح", "err");
            throw new Error("invalid_phone");
          }
          try {
            var data = await window.PlatformAPI.api("/api/core/verify-otp", {
              method: "POST",
              body: { phone: e164, code: code, role: "admin" },
            });
            if (!data || !data.token) throw new Error((data && data.error) || "فشل التحقق");
            localStorage.setItem("token", data.token);
            if (window.PlatformAPI && typeof window.PlatformAPI.setToken === "function") {
              window.PlatformAPI.setToken(data.token);
            } else {
              localStorage.setItem("ervenow_access_token", data.token);
            }
            try {
              var maxAgeSec = 7 * 24 * 60 * 60;
              var c =
                "auth_token=" +
                encodeURIComponent(data.token) +
                "; path=/; max-age=" +
                maxAgeSec +
                "; SameSite=Lax";
              if (location.protocol === "https:") c += "; Secure";
              document.cookie = c;
            } catch (cookieErr) {}
            window.location.href = "/admin-dashboard";
          } catch (e) {
            setMsg(mapOtpError(e.message || "فشل الدخول"), "err");
            throw e;
          }
        },
      });

      document.getElementById("phone").addEventListener("blur", function () {
        document.getElementById("phone").value = normalizeAdminPhone(document.getElementById("phone").value);
      });
    </script>
  </body>
</html>
