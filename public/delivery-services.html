<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERVENOW | خدمات التوصيل</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      .ds-wrap {
        max-width: 720px;
        margin: 20px auto;
        padding: 0 14px 48px;
      }
      .ds-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .ds-services {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .ds-svc {
        border: 1px solid var(--border, #e8dfd4);
        border-radius: 12px;
        padding: 12px;
        background: #fffef9;
        cursor: pointer;
        text-align: center;
        font-weight: 800;
        color: var(--brown, #3d2213);
      }
      .ds-svc.is-active {
        border-color: rgba(185, 135, 47, 0.65);
        box-shadow: 0 4px 16px rgba(155, 111, 37, 0.2);
      }
      .ds-welcome {
        margin: 14px 0;
        padding: 14px;
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(255, 254, 251, 0.98), rgba(248, 241, 229, 0.92));
        border: 1px solid rgba(61, 34, 19, 0.1);
        font-size: 0.98rem;
        line-height: 1.55;
      }
      .ds-form {
        display: grid;
        gap: 12px;
      }
      .ds-row {
        display: grid;
        gap: 8px;
      }
      .ds-row label {
        font-weight: 700;
        font-size: 0.9rem;
      }
      .ds-row select,
      .ds-row input,
      .ds-row textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border, #e8dfd4);
        font-family: inherit;
      }
      .ds-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      #dsMapModal {
        position: fixed;
        inset: 0;
        background: rgba(26, 18, 12, 0.45);
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      #dsMapModal.open {
        display: flex;
      }
      #dsMapInner {
        width: min(560px, 100%);
        background: #fff;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.2);
      }
      #dsMapBox {
        height: min(60vh, 420px);
      }
      .ds-muted {
        color: #6b5a4d;
        font-size: 0.88rem;
      }
      .ds-err {
        color: #b71c1c;
        font-weight: 700;
        font-size: 0.9rem;
      }
      .ds-ok {
        color: #1b5e20;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="layout ds-wrap">
      <div class="card ds-head">
        <h1 style="margin: 0">خدمات التوصيل</h1>
        <a class="btn btn-ghost" href="/">الرئيسية</a>
      </div>

      <div class="card" style="margin-top: 12px">
        <p class="ds-muted" style="margin: 0 0 10px">اختر الخدمة ثم أكمل النموذج. التسعير يُحسب من مسافة الطريق بين نقطتي الاستلام والتسليم.</p>
        <div class="ds-services" id="dsServiceChips"></div>
        <div class="ds-welcome" id="dsWelcome" hidden></div>
        <div id="dsFormMount"></div>
        <p class="ds-err" id="dsErr" style="display: none; margin-top: 10px"></p>
        <p class="ds-ok" id="dsOk" style="display: none; margin-top: 10px"></p>
      </div>
    </div>

    <div id="dsMapModal" aria-hidden="true">
      <div id="dsMapInner">
        <div style="padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <strong id="dsMapTitle">حدد على الخريطة</strong>
          <button type="button" class="btn btn-solid" id="dsMapConfirm">تأكيد</button>
        </div>
        <div id="dsMapBox"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/assets/api-config.js"></script>
    <script src="/assets/api.js"></script>
    <script src="/assets/cart.js"></script>
    <script>
      (function () {
        var INDUSTRIAL = [
          "صناعية العروبة",
          "صناعية أم الحمام",
          "صناعية الشمال",
          "صناعية الموسى",
          "صناعية النسيم",
          "صناعية المونسية",
          "صناعية العاصمة",
          "صناعية القديمة",
        ];
        var SA_CITIES = [
          "الرياض",
          "جدة",
          "مكة المكرمة",
          "المدينة المنورة",
          "الدمام",
          "الخبر",
          "الظهران",
          "بريدة",
          "تبوك",
          "خميس مشيط",
          "الطائف",
          "نجران",
          "جازان",
          "أبها",
          "ينبع",
          "الأحساء",
          "حائل",
          "الجبيل",
          "القطيف",
          "عرعر",
          "سكاكا",
          "الباحة",
          "الرس",
          "بيشة",
          "الدوادمي",
          "الزلفي",
          "بقيق",
          "رابغ",
          "الليث",
          "القنفذة",
        ];

        var SERVICES = [
          { id: "car_transport", label: "نقل المركبات", ready: true },
          { id: "pickup_truck", label: "ونيت", ready: true },
          { id: "local_delivery", label: "توصيل داخلي", ready: false },
          { id: "furniture", label: "نقل أثاث", ready: false },
          { id: "gas_delivery", label: "توصيل غاز", ready: true },
        ];

        var state = {
          service: "car_transport",
          pickup: null,
          dropoff: null,
          gasLocation: null,
          mapTarget: null,
          map: null,
          marker: null,
        };

        var GAS_CYL_ONE = 39;
        var GAS_CYL_TWO = 75;
        var GAS_PER_LITER = 0.9;

        function qs() {
          var p = new URLSearchParams(location.search);
          var s = (p.get("service") || "car_transport").toLowerCase();
          if (s === "vehicle_transfer") return "car_transport";
          return s;
        }

        function authHeaders() {
          var t =
            localStorage.getItem("token") ||
            localStorage.getItem("ervenow_access_token") ||
            localStorage.getItem("erwenow_access_token");
          if (!t) return {};
          return { Authorization: "Bearer " + t };
        }

        function priceCarInternal(km) {
          var d = Math.max(0, Number(km) || 0);
          if (d <= 10) return 100;
          if (d <= 35) return 180;
          if (d <= 50) return 200;
          if (d <= 100) return 250;
          return Math.round((250 + (d - 100) * 2) * 100) / 100;
        }
        function priceCarExternal(km) {
          return Math.round((Number(km) || 0) * 2 * 100) / 100;
        }

        function renderChips() {
          var el = document.getElementById("dsServiceChips");
          el.innerHTML = "";
          SERVICES.forEach(function (s) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "ds-svc" + (s.id === state.service ? " is-active" : "");
            b.textContent = s.label;
            b.onclick = function () {
              location.search = "?service=" + encodeURIComponent(s.id);
            };
            el.appendChild(b);
          });
        }

        function setWelcome() {
          var w = document.getElementById("dsWelcome");
          var s = state.service;
          if (s === "car_transport") {
            w.hidden = false;
            w.innerHTML =
              "<strong>أهلاً بك في نقل المركبات</strong><br />1) نوع المركبة — 2) حالة المركبة — 3) نقل داخلي أو خارجي — 4) موقع الاستلام — 5) موقع التسليم — ثم أرسل الطلب.";
            return;
          }
          if (s === "pickup_truck") {
            w.hidden = false;
            w.innerHTML =
              "<strong>أهلاً بك في خدمة الونيت</strong><br />نفس خطوات نقل المركبات (مواقع الاستلام والتسليم والتسعير الموحد). اختر نوع المركبة والحالة ثم حدد المواقع.";
            return;
          }
          if (s === "gas_delivery") {
            w.hidden = false;
            w.innerHTML = "<strong>🪔 أهلاً بك في خدمة توصيل الغاز من ERVENOW</strong>";
            return;
          }
          w.hidden = false;
          w.innerHTML =
            "<strong>قريباً</strong><br />سيتم تفعيل نموذج هذه الخدمة ضمن النظام الموحد. يمكنك حالياً استخدام <a href='?service=car_transport'>نقل المركبات</a>.";
        }

        function gasPrice() {
          var modeEl = document.getElementById("gdMode");
          if (!modeEl) return 0;
          if (modeEl.value === "bulk") {
            return Math.round(Number(document.getElementById("gdLiters").value) * GAS_PER_LITER * 100) / 100;
          }
          var q = parseInt(document.getElementById("gdCylinders").value, 10) || 1;
          if (q === 1) return GAS_CYL_ONE;
          if (q === 2) return GAS_CYL_TWO;
          return q * GAS_CYL_ONE;
        }

        function updateGasPrice() {
          var el = document.getElementById("gdPriceLive");
          if (!el) return;
          el.textContent = "السعر: " + gasPrice().toFixed(2) + " ر.س (عمولة المنصة 7%: " + (gasPrice() * 0.07).toFixed(2) + " ر.س)";
        }

        function toggleGasMode() {
          var bulk = document.getElementById("gdMode").value === "bulk";
          document.getElementById("gdCylinderBox").hidden = bulk;
          document.getElementById("gdBulkBox").hidden = !bulk;
          updateGasPrice();
        }

        function renderGasForm() {
          var mount = document.getElementById("dsFormMount");
          if (state.service !== "gas_delivery") return;
          var cylOpts = "";
          for (var i = 1; i <= 10; i++) {
            var p = i === 1 ? GAS_CYL_ONE : i === 2 ? GAS_CYL_TWO : i * GAS_CYL_ONE;
            cylOpts += "<option value='" + i + "'>" + i + " — " + p + " ر.س</option>";
          }
          mount.innerHTML =
            "<form class='ds-form' id='gdForm'>" +
            "<div class='ds-row'><label>نوع الخدمة</label><select id='gdMode'><option value='cylinder'>1 — تبديل أسطوانة غاز</option><option value='bulk'>2 — تعبئة غاز مركزي</option></select></div>" +
            "<div id='gdCylinderBox'><div class='ds-row'><label>عدد الأسطوانات</label><select id='gdCylinders'>" +
            cylOpts +
            "</select></div></div>" +
            "<div class='ds-subopts' id='gdBulkBox' hidden><div class='ds-row'><label>الكمية (لتر)</label><select id='gdLiters'><option value='250'>250</option><option value='500'>500</option><option value='1000'>1000</option><option value='2000'>2000</option><option value='3000'>3000</option><option value='4000'>4000</option></select></div></div>" +
            "<p class='ds-muted' id='gdPriceLive' style='font-weight:800;font-size:1.1rem;color:#3d2213'>السعر: —</p>" +
            "<div class='ds-row'><label>جوال طالب الخدمة</label><input id='gdPhone' type='tel' placeholder='05xxxxxxxx' required /></div>" +
            "<div class='ds-actions'><button type='button' class='btn btn-outline' id='gdBtnMap'>📍 حدد موقعك</button></div>" +
            "<p class='ds-muted' id='gdLocLbl'>لم يُحدد الموقع</p>" +
            "<div class='ds-row'><label>طريقة الدفع</label><div class='ds-actions'><button type='button' class='btn btn-solid' id='gdPayCod'>الدفع عند الوصول</button><button type='button' class='btn btn-primary' id='gdPayNow'>الدفع الآن (السلة)</button></div></div>" +
            "</form>";
          document.getElementById("gdMode").onchange = toggleGasMode;
          document.getElementById("gdCylinders").onchange = updateGasPrice;
          document.getElementById("gdLiters").onchange = updateGasPrice;
          document.getElementById("gdBtnMap").onclick = function () {
            openMap("gas");
          };
          document.getElementById("gdPayCod").onclick = submitGasCod;
          document.getElementById("gdPayNow").onclick = submitGasPayNow;
          toggleGasMode();
        }

        function openMap(which) {
          state.mapTarget = which;
          var title = "حدد موقع التسليم";
          if (which === "pickup") title = "حدد موقع المركبة (الاستلام)";
          else if (which === "gas") title = "حدد موقع التوصيل";
          document.getElementById("dsMapTitle").textContent = title;
          var m = document.getElementById("dsMapModal");
          m.classList.add("open");
          m.setAttribute("aria-hidden", "false");
          setTimeout(initMapIfNeeded, 50);
        }

        function closeMap() {
          var m = document.getElementById("dsMapModal");
          m.classList.remove("open");
          m.setAttribute("aria-hidden", "true");
        }

        function initMapIfNeeded() {
          if (state.map) {
            state.map.invalidateSize();
            return;
          }
          var center = [24.7136, 46.6753];
          state.map = L.map("dsMapBox").setView(center, 11);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap",
          }).addTo(state.map);
          state.marker = L.marker(center, { draggable: true }).addTo(state.map);
          state.map.on("click", function (e) {
            state.marker.setLatLng(e.latlng);
          });
        }

        function confirmMap() {
          if (!state.marker) return closeMap();
          var ll = state.marker.getLatLng();
          if (state.mapTarget === "gas") {
            state.gasLocation = { lat: ll.lat, lng: ll.lng };
            var lbl = document.getElementById("gdLocLbl");
            if (lbl) lbl.textContent = "تم تحديد الموقع: " + ll.lat.toFixed(5) + ", " + ll.lng.toFixed(5);
            closeMap();
            return;
          }
          if (state.mapTarget === "pickup") state.pickup = { lat: ll.lat, lng: ll.lng };
          else state.dropoff = { lat: ll.lat, lng: ll.lng };
          var pu = document.getElementById("dsPickupLbl");
          var dr = document.getElementById("dsDropLbl");
          if (pu) pu.textContent = state.pickup ? "تم تحديد موقع الاستلام" : "لم يُحدد";
          if (dr) dr.textContent = state.dropoff ? "تم تحديد موقع التسليم" : "لم يُحدد";
          updateEstimate();
          closeMap();
        }

        function gasPayload(paymentMethod) {
          var bulk = document.getElementById("gdMode").value === "bulk";
          return {
            mode: bulk ? "bulk" : "cylinder",
            cylinders: bulk ? null : parseInt(document.getElementById("gdCylinders").value, 10) || 1,
            liters: bulk ? parseInt(document.getElementById("gdLiters").value, 10) : null,
            payment_method: paymentMethod,
            lat: state.gasLocation.lat,
            lng: state.gasLocation.lng,
            customer_phone: document.getElementById("gdPhone").value.trim(),
          };
        }

        function validateGas() {
          var err = document.getElementById("dsErr");
          var okEl = document.getElementById("dsOk");
          err.style.display = "none";
          okEl.style.display = "none";
          if (!state.gasLocation) {
            err.textContent = "يرجى تحديد موقع التوصيل.";
            err.style.display = "block";
            return false;
          }
          var phone = document.getElementById("gdPhone").value.trim();
          if (!/^05\d{8}$/.test(phone)) {
            err.textContent = "أدخل رقم جوال صحيح (05xxxxxxxx).";
            err.style.display = "block";
            return false;
          }
          if (!authHeaders().Authorization) {
            err.textContent = "يجب تسجيل الدخول أولاً.";
            err.style.display = "block";
            return false;
          }
          return true;
        }

        function submitGasCod() {
          if (!validateGas()) return;
          var err = document.getElementById("dsErr");
          var okEl = document.getElementById("dsOk");
          fetch(window.PlatformAPI.apiUrl("/api/delivery/create"), {
            method: "POST",
            headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
            body: JSON.stringify({
              service_type: "gas_delivery",
              payload: gasPayload("cash_on_delivery"),
              customer_phone: document.getElementById("gdPhone").value.trim(),
            }),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, j: j };
              });
            })
            .then(function (x) {
              if (!x.ok || !x.j || x.j.ok === false) {
                err.textContent = (x.j && (x.j.message || x.j.error)) || "فشل الإرسال";
                err.style.display = "block";
                return;
              }
              var o = x.j.order || {};
              okEl.textContent =
                "تم إنشاء الطلب — رقم: " +
                (o.order_number || o.service_order_number || o.id) +
                " — الدفع عند الوصول. تم إشعار المزودين.";
              okEl.style.display = "block";
            })
            .catch(function () {
              err.textContent = "خطأ في الاتصال";
              err.style.display = "block";
            });
        }

        function submitGasPayNow() {
          if (!validateGas()) return;
          var bulk = document.getElementById("gdMode").value === "bulk";
          var price = gasPrice();
          var title = bulk ? "تعبئة غاز مركزي" : "تبديل اسطوانة غاز";
          var qty = bulk
            ? parseInt(document.getElementById("gdLiters").value, 10)
            : parseInt(document.getElementById("gdCylinders").value, 10);
          addToCart({
            type: "gas_delivery",
            title: title,
            price: price,
            data: {
              gas_mode: bulk ? "central_refill" : "cylinder_swap",
              gas_liters: bulk ? qty : null,
              qty: qty,
              location: state.gasLocation.lat.toFixed(6) + "," + state.gasLocation.lng.toFixed(6),
              customer_phone: document.getElementById("gdPhone").value.trim(),
              payment_status: "paid",
              total_amount: price,
            },
          });
          location.href = "/cart.html";
        }

        function haversineKm(a, b, c, d) {
          var R = 6371;
          var toR = function (x) {
            return (x * Math.PI) / 180;
          };
          var dLat = toR(c - a);
          var dLng = toR(d - b);
          var x =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toR(a)) * Math.cos(toR(c)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
          return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
        }

        function updateEstimate() {
          var el = document.getElementById("dsEstimate");
          if (!el) return;
          if (!state.pickup || !state.dropoff) {
            el.textContent = "حدد موقعي الاستلام والتسليم لعرض تقدير المسافة والسعر التقريبي.";
            return;
          }
          var km = haversineKm(state.pickup.lat, state.pickup.lng, state.dropoff.lat, state.dropoff.lng);
          var mode = (document.getElementById("dsTransfer") || {}).value || "internal";
          var fee = mode === "external" ? priceCarExternal(km) : priceCarInternal(km);
          el.textContent =
            "تقدير (خط مستقيم ≈ " +
            km.toFixed(1) +
            " كم): " +
            fee.toFixed(2) +
            " ر.س — السعر النهائي يُحسب من مسار الطريق على الخادم.";
        }

        function renderForms() {
          if (state.service === "gas_delivery") {
            renderGasForm();
            return;
          }
          renderCarForm();
        }

        function renderCarForm() {
          var mount = document.getElementById("dsFormMount");
          if (state.service !== "car_transport" && state.service !== "pickup_truck") {
            if (state.service !== "gas_delivery") mount.innerHTML = "";
            return;
          }
          var indOpts = INDUSTRIAL.map(function (x) {
            return "<option value='" + x.replace(/'/g, "&#39;") + "'>" + x + "</option>";
          }).join("");
          var cityOpts = SA_CITIES.map(function (x) {
            return "<option value='" + x.replace(/'/g, "&#39;") + "'>" + x + "</option>";
          }).join("");
          mount.innerHTML =
            "<form class='ds-form' id='dsCarForm'>" +
            "<div class='ds-row'><label>نوع المركبة</label><select id='dsVehCat' required><option value='sedan'>سيدان</option><option value='van'>فان</option><option value='suv'>جيب</option></select></div>" +
            "<div class='ds-row'><label>حالة المركبة</label><select id='dsVehCond' required><option value='working'>صالحة</option><option value='damaged'>مصدوم</option><option value='broken'>معطل</option><option value='appraisal'>تقديرات</option></select></div>" +
            "<div class='ds-row'><label>نوع النقل</label><select id='dsTransfer' required><option value='internal'>نقل داخلي</option><option value='external'>نقل خارجي</option></select></div>" +
            "<div class='ds-row' id='dsDistrictRow'><label>منطقة صناعية (اختياري — يُضاف للعنوان)</label><select id='dsPickupInd'><option value=''>—</option>" +
            indOpts +
            "</select></div>" +
            "<div class='ds-row'><label>منطقة تسليم صناعية (اختياري)</label><select id='dsDropInd'><option value=''>—</option>" +
            indOpts +
            "</select></div>" +
            "<div class='ds-row' id='dsCityRow' style='display:none'><label>من مدينة</label><select id='dsFromCity'><option value=''>—</option>" +
            cityOpts +
            "</select></div>" +
            "<div class='ds-row' id='dsCityRow2' style='display:none'><label>إلى مدينة</label><select id='dsToCity'><option value=''>—</option>" +
            cityOpts +
            "</select></div>" +
            "<div class='ds-actions'><button type='button' class='btn btn-outline' id='dsBtnPickup'>تحديد موقع الاستلام على الخريطة</button>" +
            "<button type='button' class='btn btn-outline' id='dsBtnDrop'>تحديد موقع التسليم على الخريطة</button></div>" +
            "<p class='ds-muted' id='dsPickupLbl'>لم يُحدد موقع الاستلام</p>" +
            "<p class='ds-muted' id='dsDropLbl'>لم يُحدد موقع التسليم</p>" +
            "<div class='ds-row'><label>جوال التواصل</label><input id='dsPhone' type='tel' placeholder='05xxxxxxxx' /></div>" +
            "<div class='ds-row'><label>ملاحظات إضافية</label><textarea id='dsNotes' rows='2'></textarea></div>" +
            "<p class='ds-muted' id='dsEstimate'></p>" +
            "<button type='submit' class='btn btn-solid' id='dsSubmit'>إرسال الطلب</button>" +
            "</form>";

          document.getElementById("dsBtnPickup").onclick = function () {
            openMap("pickup");
          };
          document.getElementById("dsBtnDrop").onclick = function () {
            openMap("dropoff");
          };
          document.getElementById("dsTransfer").onchange = function () {
            var ext = document.getElementById("dsTransfer").value === "external";
            document.getElementById("dsCityRow").style.display = ext ? "grid" : "none";
            document.getElementById("dsCityRow2").style.display = ext ? "grid" : "none";
            updateEstimate();
          };
          document.getElementById("dsCarForm").onsubmit = submitCar;
          updateEstimate();
        }

        function submitCar(ev) {
          ev.preventDefault();
          var err = document.getElementById("dsErr");
          var ok = document.getElementById("dsOk");
          err.style.display = "none";
          ok.style.display = "none";
          if (!state.pickup || !state.dropoff) {
            err.textContent = "يرجى تحديد موقعي الاستلام والتسليم.";
            err.style.display = "block";
            return;
          }
          var transfer = document.getElementById("dsTransfer").value;
          if (transfer === "external") {
            if (!document.getElementById("dsFromCity").value || !document.getElementById("dsToCity").value) {
              err.textContent = "اختر مدينة الانطلاق والوصول للنقل الخارجي.";
              err.style.display = "block";
              return;
            }
          }
          var tok = authHeaders().Authorization;
          if (!tok) {
            err.textContent = "يجب تسجيل الدخول أولاً.";
            err.style.display = "block";
            return;
          }
          var payload = {
            vehicle_category: document.getElementById("dsVehCat").value,
            vehicle_condition: document.getElementById("dsVehCond").value,
            transfer_mode: transfer,
            pickup_lat: state.pickup.lat,
            pickup_lng: state.pickup.lng,
            drop_lat: state.dropoff.lat,
            drop_lng: state.dropoff.lng,
            pickup_district_label: document.getElementById("dsPickupInd").value,
            drop_district_label: document.getElementById("dsDropInd").value,
            from_city: document.getElementById("dsFromCity").value,
            to_city: document.getElementById("dsToCity").value,
            notes_extra: document.getElementById("dsNotes").value.trim(),
          };
          var phone = document.getElementById("dsPhone").value.trim();
          fetch(window.PlatformAPI.apiUrl("/api/delivery/create"), {
            method: "POST",
            headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
            body: JSON.stringify({
              service_type: state.service,
              payload: payload,
              customer_phone: phone,
            }),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                return { ok: r.ok, j: j };
              });
            })
            .then(function (x) {
              if (!x.ok || !x.j || x.j.ok === false) {
                err.textContent = (x.j && (x.j.message || x.j.error)) || "فشل الإرسال";
                err.style.display = "block";
                return;
              }
              var sn = x.j.summary || {};
              var px = sn.price != null ? " — " + sn.price + " ر.س (أجرة التوصيل)" : "";
              ok.textContent =
                "تم إنشاء الطلب بنجاح — رقم الطلب: " +
                (x.j.order && (x.j.order.order_number || x.j.order.id)) +
                px;
              ok.style.display = "block";
            })
            .catch(function () {
              err.textContent = "خطأ في الاتصال";
              err.style.display = "block";
            });
        }

        document.getElementById("dsMapConfirm").onclick = confirmMap;

        state.service = qs();
        renderChips();
        setWelcome();
        renderForms();
      })();
    </script>
  </body>
</html>
