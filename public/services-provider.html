<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERVENOW | مزود الخدمة</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>
      .hub-pay-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 12px 0 14px;
      }
      .hub-pay-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        font-weight: 700;
        font-size: 0.88rem;
        cursor: pointer;
      }
      .hub-pay-row input[type="checkbox"] {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
      }
      .hub-pay-row img {
        height: 22px;
        width: auto;
        max-width: 49px;
        min-width: 29px;
        object-fit: contain;
        border-radius: 8px;
        background: #fff;
        padding: 5px 10px;
        box-shadow: 0 2px 8px rgba(45, 26, 14, 0.1);
      }
      .hub-pay-row input:disabled + img {
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="top-nav">
        <h1 style="margin: 0">طلبات مزود الخدمة</h1>
        <div class="btn-row">
          <a class="btn btn-ghost" href="/">الرئيسية</a>
          <a class="btn btn-ghost" href="/login" id="logoutBtn">خروج</a>
        </div>
      </div>

      <div class="card">
        <div class="btn-row">
          <button class="btn btn-primary" type="button" id="refreshBtn">تحديث</button>
        </div>
        <p class="sub" id="summary">—</p>
        <div id="list"></div>
      </div>

      <div class="card" id="svcPayCard">
        <h2 style="margin: 0 0 8px">وسائل الدفع في السلة</h2>
        <p class="sub" style="margin: 0 0 12px">
          يظهر للعميل تقاطع إعدادات المنصة مع اختياراتك. عطّل ما لا تناسبك (مثل الدفع عند الاستلام أو البطاقات).
        </p>
        <div class="hub-pay-grid" id="svcPayGrid"></div>
        <button type="button" class="btn btn-primary" id="btnSaveSvcPay">حفظ وسائل الدفع</button>
        <p class="sub" id="svcPayMsg" style="margin-top: 10px"></p>
      </div>
    </div>

    <script src="/assets/api-config.js"></script>
    <script src="/assets/api.js"></script>
    <script src="/assets/cart.js"></script>
    <script>
      var SVC_PAY_ROWS = [
        { key: "ew_pay", label: "EW PAY", src: "/assets/pay-ew.svg" },
        { key: "mada", label: "مدى", src: "/assets/pay-mada.svg" },
        { key: "visa", label: "Visa", src: "/assets/pay-visa.svg" },
        { key: "mastercard", label: "Mastercard", src: "/assets/pay-mastercard.svg" },
        { key: "apple_pay", label: "Apple Pay", src: "/assets/pay-apple.svg" },
        { key: "stc_pay", label: "STC Pay", src: "/assets/pay-stcpay.svg" },
        { key: "cash_on_delivery", label: "الدفع عند الوصول", src: "/assets/pay-cod.svg" },
        { key: "tabby", label: "Tabby", src: "/assets/pay-tabby.svg" },
        { key: "tamara", label: "Tamara", src: "/assets/pay-tamara.svg" },
      ];
      var __svcPlat = {};
      var __svcEff = {};

      function buildSvcPayGrid() {
        var box = document.getElementById("svcPayGrid");
        if (!box || box.getAttribute("data-built")) return;
        box.setAttribute("data-built", "1");
        box.innerHTML = SVC_PAY_ROWS.map(function (row) {
          return (
            '<label class="hub-pay-row">' +
            '<input type="checkbox" id="svcPay_' +
            row.key +
            '" />' +
            '<img src="' +
            row.src +
            '" alt="" width="49" height="25" loading="lazy" />' +
            "<span>" +
            row.label +
            "</span></label>"
          );
        }).join("");
      }

      function applySvcPayUi() {
        SVC_PAY_ROWS.forEach(function (row) {
          var cb = document.getElementById("svcPay_" + row.key);
          if (!cb) return;
          var pOn = !(__svcPlat && __svcPlat[row.key] === false);
          cb.disabled = !pOn;
          cb.checked = pOn && !!(__svcEff && __svcEff[row.key]);
        });
      }

      async function loadSvcPaySettings() {
        var msg = document.getElementById("svcPayMsg");
        if (msg) msg.textContent = "";
        var token =
          window.PlatformAPI && typeof window.PlatformAPI.getToken === "function" ? window.PlatformAPI.getToken() : "";
        if (!token || !String(token).trim()) return;
        buildSvcPayGrid();
        try {
          var platJ = await window.PlatformAPI.api("/api/core/checkout-payment-methods");
          var effJ = await window.PlatformAPI.api("/api/services/me/checkout-payment-methods");
          __svcPlat = platJ.methods || {};
          __svcEff = effJ.methods || {};
          applySvcPayUi();
        } catch (e) {
          if (msg) msg.textContent = String((e && e.message) || e || "تعذر تحميل وسائل الدفع");
        }
      }

      document.getElementById("btnSaveSvcPay").addEventListener("click", async function () {
        var msg = document.getElementById("svcPayMsg");
        if (msg) msg.textContent = "";
        try {
          var o = {};
          SVC_PAY_ROWS.forEach(function (row) {
            var cb = document.getElementById("svcPay_" + row.key);
            if (!cb) return;
            o[row.key] = cb.disabled ? false : !!cb.checked;
          });
          var j = await window.PlatformAPI.api("/api/services/me/checkout-payment-methods", {
            method: "PATCH",
            body: { methods: o },
          });
          __svcEff = j.methods || __svcEff;
          applySvcPayUi();
          if (msg) msg.textContent = "تم الحفظ";
        } catch (e) {
          if (msg) msg.textContent = String((e && e.message) || e || "تعذر الحفظ");
        }
      });

      function payLabel(v) {
        return String(v || "").toLowerCase() === "paid" ? "مدفوع" : "غير مدفوع";
      }

      function statusLabel(v) {
        const s = String(v || "").toLowerCase();
        if (s === "new") return "جديد";
        if (s === "accepted") return "مقبول";
        if (s === "delivering") return "قيد التنفيذ";
        if (s === "delivered") return "تم التوصيل";
        if (s === "cancelled") return "ملغي";
        return s || "—";
      }

      function safeClick(fn) {
        let locked = false;
        return async function (...args) {
          if (locked) return;
          locked = true;
          try {
            await fn.apply(this, args);
          } finally {
            locked = false;
          }
        };
      }

      const markDelivered = safeClick(async function (id, btn) {
        if (btn) {
          btn.disabled = true;
          btn.innerText = "جاري التحديث...";
        }
        try {
          const token =
            window.PlatformAPI && typeof window.PlatformAPI.getToken === "function"
              ? window.PlatformAPI.getToken()
              : "";
          const res = await fetch(window.PlatformAPI.apiUrl("/api/services/bookings/" + encodeURIComponent(id) + "/status"), {
            method: "PATCH",
            headers: Object.assign(
              { "Content-Type": "application/json" },
              token ? { Authorization: "Bearer " + token } : {}
            ),
            body: JSON.stringify({ status: "delivered" }),
          });
          const data = await res.json().catch(function () {
            return {};
          });
          if (!res.ok || !data.ok) throw new Error(data.error || "update failed");
          showSuccess("✅ تم إتمام المهمة — العمولة في ذمتكم ويجب توريدها للمنصة");
          await loadBookings();
        } catch (e) {
          showError("❌ حدث خطأ أثناء التحديث");
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.innerText = "إتمام المهمة";
          }
        }
      });

      function render(list) {
        const el = document.getElementById("list");
        if (!el) return;
        if (!list.length) {
          el.innerHTML = "<p class='sub'>لا توجد طلبات حالياً</p>";
          return;
        }
        el.innerHTML = list
          .map(function (b) {
            return (
              "<div class='card' style='margin-top:8px'>" +
              "<p><b>" +
              (b.service_name || "خدمة") +
              "</b></p>" +
              "<p>رقم الخدمة: " +
              (b.service_order_number || "—") +
              "</p>" +
              "<p>جوال زائر المنصة: " +
              (b.customer_phone || "—") +
              "</p>" +
              "<p>الحي: " +
              (b.district || "—") +
              "</p>" +
              "<p>الموقع: " +
              (b.location || "—") +
              "</p>" +
              (String(b.service_type || "") === "gas_delivery" && b.gas_mode === "central_refill"
                ? "<p>الكمية: " + (b.gas_liters || b.qty) + " لتر (تعبئة مركزي)</p>"
                : String(b.service_type || "") === "gas_delivery"
                  ? "<p>عدد الأسطوانات: " + (b.qty || 1) + "</p>"
                  : "<p>العدد: " + (b.qty || 1) + "</p>") +
              "<p>الحالة المالية: " +
              payLabel(b.payment_status) +
              "</p>" +
              "<p>القيمة: " +
              Number(b.total_amount || 0).toFixed(2) +
              " ريال</p>" +
              "<p>عمولة المنصة: " +
              Number(b.platform_commission || 0).toFixed(2) +
              " ريال</p>" +
              "<p>الحالة: " +
              statusLabel(b.status) +
              "</p>" +
              "<p>تقييم زائر المنصة: " +
              (b.rating ? b.rating + "/5" : "—") +
              "</p>" +
              "<p>المراجعة: " +
              (b.review || "—") +
              "</p>" +
              (String(b.status || "").toLowerCase() === "delivered"
                ? ""
                : "<button class='btn btn-primary' type='button' onclick='markDelivered(\"" +
                  b.id +
                  "\", this)'>إتمام المهمة</button>" +
                  "<p class='sub' style='margin-top:6px'>بعد الإتمام تُسجَّل عمولة المنصة في ذمتكم ويجب توريدها للمنصة.</p>") +
              "</div>"
            );
          })
          .join("");
      }

      async function loadBookings() {
        try {
          const j = await window.PlatformAPI.api("/api/services/bookings");
          const list = Array.isArray(j.bookings) ? j.bookings : [];
          render(list);
          const summary = document.getElementById("summary");
          if (summary) summary.textContent = "عدد الطلبات: " + list.length;
        } catch (e) {
          showError("❌ تعذر تحميل الطلبات");
        }
      }

      document.getElementById("refreshBtn").addEventListener("click", loadBookings);
      document.getElementById("logoutBtn").addEventListener("click", function (e) {
        e.preventDefault();
        window.PlatformAPI.setToken("");
        location.href = "/login";
      });

      loadBookings();
      loadSvcPaySettings();
      setInterval(loadBookings, 5000);
    </script>
  </body>
</html>
