<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <script src="/assets/viewport-fit.js?erv=20260612"></script>
    <script src="/assets/pre-reg-banner.js?erv=20260905b" defer></script>
    <title>ERVENOW | حسابك قيد المراجعة</title>
    <meta name="description" content="تم استلام طلب العضوية بنجاح. عضويتك قيد المراجعة من إدارة ERVENOW، وسيتم إشعارك فور الاعتماد والتفعيل." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <style>
      .pending-wrap {
        max-width: 520px;
        margin: 48px auto;
        padding: 28px 24px;
        text-align: center;
      }
      .pending-icon {
        font-size: 3rem;
        line-height: 1;
        margin-bottom: 12px;
      }
      .pending-wrap h1 {
        margin: 0 0 10px;
        font-size: 1.35rem;
      }
      .pending-wrap p {
        margin: 0 0 16px;
        color: rgba(61, 34, 19, 0.78);
        line-height: 1.65;
      }
      .pending-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="card pending-wrap">
        <div class="pending-icon" aria-hidden="true">⏳</div>
        <h1 id="pendingTitle">طلبك قيد المراجعة لدى ERVENOW</h1>
        <p id="pendingLead">تم استلام طلب الانضمام بنجاح.</p>
        <p id="pendingBody">سيظهر الطلب لإدارة ERVENOW للمراجعة، وسنُعلمك بالنتيجة.</p>
        <p class="sub" id="pendingPhone">—</p>
        <p class="sub" id="pendingNeeds" hidden></p>
        <div class="pending-actions">
          <a class="btn btn-primary" href="/">الرئيسية</a>
          <a class="btn btn-ghost" id="pendingLoginBtn" href="/login">دخول الأعضاء</a>
          <a class="btn btn-ghost" id="pendingResumeBtn" href="/register-store" hidden>استكمال البيانات</a>
        </div>
      </div>
    </div>
    <script src="/assets/api-config.js"></script>
    <script src="/assets/api.js?erv=20260612"></script>
    <script>
      (function () {
        try {
          var headline = sessionStorage.getItem("ervenow_pending_headline") || "";
          var subline = sessionStorage.getItem("ervenow_pending_subline") || "";
          if (headline) document.getElementById("pendingTitle").textContent = headline;
          if (subline) document.getElementById("pendingLead").textContent = subline;
        } catch (h) {}
        try {
          var p = localStorage.getItem("userPhone") || "";
          if (p) document.getElementById("pendingPhone").textContent = "الجوال: " + p;
        } catch (e) {}
        try {
          var loginBtn = document.getElementById("pendingLoginBtn");
          var portal = localStorage.getItem("erv_pending_login_url") || "";
          if (loginBtn && portal && portal.indexOf("/") === 0) loginBtn.href = portal;
        } catch (portalErr) {}
        var token = "";
        try {
          token = sessionStorage.getItem("ervenow_registration_token") || "";
        } catch (_t) {}
        if (token && window.PlatformAPI && window.PlatformAPI.api) {
          window.PlatformAPI.api("/api/store/onboarding-status?registration_token=" + encodeURIComponent(token))
            .then(function (j) {
              if (!j || !j.needs_info) return;
              var n = document.getElementById("pendingNeeds");
              var resume = document.getElementById("pendingResumeBtn");
              document.getElementById("pendingTitle").textContent = "مطلوب استكمال بيانات طلبك";
              if (n) {
                n.hidden = false;
                n.textContent = j.needs_info_message || "يرجى استكمال البيانات وإعادة إرسال نفس الطلب.";
              }
              if (resume) resume.hidden = false;
            })
            .catch(function () {});
        }
        try {
          localStorage.removeItem("token");
          localStorage.removeItem("userId");
        } catch (e2) {}
        if (window.PlatformAPI && window.PlatformAPI.setToken) window.PlatformAPI.setToken("");
        document.cookie = "auth_token=; path=/; max-age=0; SameSite=Lax";
      })();
    </script>
  </body>
</html>
