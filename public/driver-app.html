<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <script src="/assets/viewport-fit.js?erv=20260612b"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/guest-shell.css?erv=20260612b" />
    <link rel="stylesheet" href="/assets/driver-shell.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body class="guest-shell-page driver-page driver-app-page">
    <div id="driverShellHeader"></div>
    <div class="dash-main">
      <div id="driverShellHero"></div>

      <div class="layout driver-app-layout">
        <nav class="driver-app-segments" role="tablist" aria-label="أقسام التتبع الحي">
          <button type="button" class="driver-app-segment is-active" role="tab" id="daTabOrders" data-panel="orders" aria-selected="true" aria-controls="daPanelOrders">
            <span class="driver-app-segment__ic" aria-hidden="true">📋</span>
            <span class="driver-app-segment__label">قائمة الطلبات</span>
          </button>
          <button type="button" class="driver-app-segment" role="tab" id="daTabTrack" data-panel="track" aria-selected="false" aria-controls="daPanelTrack">
            <span class="driver-app-segment__ic" aria-hidden="true">📍</span>
            <span class="driver-app-segment__label">التتبع الحي</span>
          </button>
        </nav>

        <div id="daErr" class="driver-app-alert msg err" role="alert" hidden></div>

        <section class="driver-app-panel da-panel is-visible" id="daPanelOrders" role="tabpanel" aria-labelledby="daTabOrders">
          <div class="driver-panel-card driver-app-card">
            <header class="driver-app-card__head">
              <h2 class="driver-app-card__title">طلباتي النشطة</h2>
              <p class="driver-app-card__hint">اختر طلباً — يظهر رقمه في أعلى البطاقة — ثم انتقل للتتبع الحي.</p>
            </header>
            <div class="driver-app-card__body">
              <div id="daOrders" class="driver-app-orders" aria-live="polite"></div>
              <button type="button" class="driver-refresh-btn" id="daBtnRefreshOrders">تحديث القائمة</button>
            </div>
          </div>
        </section>

        <section class="driver-app-panel da-panel" id="daPanelTrack" role="tabpanel" aria-labelledby="daTabTrack" hidden>
          <div class="driver-panel-card driver-app-card driver-app-card--track">
            <header class="driver-app-card__head driver-app-card__head--compact">
              <h2 class="driver-app-card__title">الخريطة والموقع الحي</h2>
            </header>
            <div class="driver-app-card__body">
              <div id="daTrackEmpty" class="drv-empty-state driver-app-track-empty">
                <p>لم يُختر طلب بعد.</p>
                <button type="button" class="drv-btn drv-btn--gold" id="daGoOrders">العودة لقائمة الطلبات</button>
              </div>

              <div id="daTrackActive" class="driver-app-track-active" hidden>
                <div class="driver-app-status">
                  <div class="driver-app-status__order" id="daOrderChip" translate="no">—</div>
                  <p class="driver-app-status__line" id="daOrderStatus">—</p>
                  <p class="driver-app-status__line driver-app-status__line--gps" id="daLocStatus">—</p>
                </div>
                <div id="daMap" class="driver-app-map" role="application" aria-label="خريطة التتبع"></div>
                <div class="driver-app-actions">
                  <button type="button" class="drv-btn drv-btn--gold" id="daBtnStart">بدء التوصيل</button>
                  <button type="button" class="drv-btn drv-btn--ghost" id="daBtnArrived">وصلت للعنوان</button>
                  <button type="button" class="drv-btn drv-btn--gold" id="daBtnDelivered">تم التسليم</button>
                </div>
                <p class="driver-app-footnote">يُرسل موقعك للخادم كل ~2.5 ثانية أثناء التتبع، مع بث لحظي لصفحة العميل.</p>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div id="driverShellFooter"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/assets/osrm-route-leaflet.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
    <script src="/assets/api-config.js"></script>
    <script src="/assets/api.js"></script>
    <script src="/assets/driver-nav.js"></script>
    <script>
      ErvenowDriverNav.mount({
        activeNav: "track",
        hero: {
          eyebrow: "شريك التوصيل",
          eyebrowLarge: true,
          title: "التتبع الحي",
          sub: "",
        },
      });
    </script>
    <script>
      var token = window.PlatformAPI.getToken();
      if (!token) {
        document.body.innerHTML =
          '<div class="driver-auth-gate"><h2>🔒 سجّل الدخول كمندوب</h2><a class="drv-btn drv-btn--gold" href="/driver-login">تسجيل الدخول</a></div>';
        throw new Error("auth");
      }

      var daMap = null;
      var daMarker = null;
      var daPickup = null;
      var daDrop = null;
      var daLine = null;
      var daRouteKey = "";
      var daRouteReq = 0;
      var daSocket = null;
      var daWatchId = null;
      var daSendTimer = null;
      var daLastLat = null;
      var daLastLng = null;
      var daLastSpeed = null;
      var daLastHeading = null;
      var daActiveOrder = null;
      var daMeRole = null;

      var daLocStatus = document.getElementById("daLocStatus");
      var daOrderStatus = document.getElementById("daOrderStatus");
      var daOrderChip = document.getElementById("daOrderChip");
      var daErr = document.getElementById("daErr");
      var daTrackEmpty = document.getElementById("daTrackEmpty");
      var daTrackActive = document.getElementById("daTrackActive");

      function showErr(msg) {
        if (!daErr) return;
        var on = !!msg;
        daErr.hidden = !on;
        daErr.textContent = msg || "";
      }

      function orderDisplayNumber(o) {
        if (!o) return "—";
        return (o.order_number && String(o.order_number).trim()) || (o.id && String(o.id).slice(0, 8) + "…") || "—";
      }

      function updateTrackView() {
        var has = !!(daActiveOrder && daActiveOrder.id);
        if (daTrackEmpty) daTrackEmpty.hidden = has;
        if (daTrackActive) daTrackActive.hidden = !has;
        if (has && daOrderChip) {
          daOrderChip.textContent = "طلب #" + orderDisplayNumber(daActiveOrder);
        }
      }

      function parseHashPanel() {
        var h = (location.hash || "").replace(/^#/, "").trim().toLowerCase();
        if (h === "track") return h;
        return "orders";
      }

      function setActivePanel(id) {
        var cap = id.charAt(0).toUpperCase() + id.slice(1);
        document.querySelectorAll(".da-panel").forEach(function (el) {
          var on = el.id === "daPanel" + cap;
          el.classList.toggle("is-visible", on);
          el.hidden = !on;
        });
        document.querySelectorAll(".driver-app-segment").forEach(function (btn) {
          var p = btn.getAttribute("data-panel");
          var on = p === id;
          btn.classList.toggle("is-active", on);
          btn.setAttribute("aria-selected", on ? "true" : "false");
        });
        if (id === "track") {
          setTimeout(function () {
            try {
              if (daMap) daMap.invalidateSize();
            } catch (e) {}
          }, 120);
        }
      }

      function syncHashUi() {
        setActivePanel(parseHashPanel());
      }
      window.addEventListener("hashchange", syncHashUi);

      document.querySelectorAll(".driver-app-segment").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var p = btn.getAttribute("data-panel");
          if (p) location.hash = "#" + p;
        });
      });

      var daGoOrders = document.getElementById("daGoOrders");
      if (daGoOrders) {
        daGoOrders.onclick = function () {
          location.hash = "#orders";
        };
      }

      function initMap() {
        if (daMap || typeof L === "undefined") return;
        daMap = L.map("daMap").setView([24.7136, 46.6753], 12);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap",
        }).addTo(daMap);
      }

      function clearRoute() {
        if (!daMap) return;
        if (daPickup) {
          daMap.removeLayer(daPickup);
          daPickup = null;
        }
        if (daDrop) {
          daMap.removeLayer(daDrop);
          daDrop = null;
        }
        if (daLine) {
          daMap.removeLayer(daLine);
          daLine = null;
        }
        daRouteKey = "";
      }

      async function renderOrderOnMap(order) {
        initMap();
        if (!daMap || !order) return;
        clearRoute();
        var pLat = Number(order.pickup_lat);
        var pLng = Number(order.pickup_lng);
        var dLat = Number(order.drop_lat);
        var dLng = Number(order.drop_lng);
        if (Number.isFinite(pLat) && Number.isFinite(pLng)) {
          daPickup = L.marker([pLat, pLng]).addTo(daMap).bindPopup("استلام");
        }
        if (Number.isFinite(dLat) && Number.isFinite(dLng)) {
          daDrop = L.marker([dLat, dLng]).addTo(daMap).bindPopup("تسليم");
        }
        var hasPickup = Number.isFinite(pLat) && Number.isFinite(pLng);
        var hasDrop = Number.isFinite(dLat) && Number.isFinite(dLng);
        if (hasPickup && !hasDrop) {
          daMap.setView([pLat, pLng], 14);
          return;
        }
        if (!hasPickup && hasDrop) {
          daMap.setView([dLat, dLng], 14);
          return;
        }
        if (!hasPickup || !hasDrop) return;

        var routeKey = [pLat.toFixed(6), pLng.toFixed(6), dLat.toFixed(6), dLng.toFixed(6)].join("|");
        if (daLine && daRouteKey === routeKey) return;

        var reqId = ++daRouteReq;
        try {
          if (!window.ErvenowOsrmRoute || !ErvenowOsrmRoute.drawOnMap) throw new Error("osrm_module");
          var res = await ErvenowOsrmRoute.drawOnMap(
            daMap,
            { lat: pLat, lng: pLng },
            { lat: dLat, lng: dLng },
            {
              style: { color: "#b9872f", weight: 5 },
              padding: [36, 36],
              maxZoom: 15,
            }
          );
          if (reqId !== daRouteReq) {
            if (res.layer) daMap.removeLayer(res.layer);
            return;
          }
          daLine = res.layer;
          daRouteKey = routeKey;
        } catch (e) {
          if (reqId !== daRouteReq) return;
        }
      }

      function updateSelfMarker(lat, lng) {
        initMap();
        if (!daMap) return;
        var la = Number(lat);
        var ln = Number(lng);
        if (!Number.isFinite(la) || !Number.isFinite(ln)) return;
        if (!daMarker) {
          daMarker = L.circleMarker([la, ln], { radius: 10, color: "#3d2213", fillColor: "#b9872f", fillOpacity: 0.9 })
            .addTo(daMap)
            .bindPopup("موقعك");
        } else {
          daMarker.setLatLng([la, ln]);
        }
        try {
          daMap.invalidateSize();
        } catch (e) {}
      }

      function ensureSocket() {
        if (typeof io === "undefined") return null;
        if (daSocket) return daSocket;
        daSocket = io({
          path: "/socket.io/",
          transports: ["websocket", "polling"],
          auth: { token: token },
        });
        return daSocket;
      }

      function joinOrderRoom(orderId) {
        var s = ensureSocket();
        if (!s || !orderId) return;
        try {
          s.emit("join:order", String(orderId).trim());
        } catch (e) {}
      }

      function pushLocationSocket(orderId) {
        if (daLastLat == null || daLastLng == null) return;
        var s = ensureSocket();
        if (!s || !orderId) return;
        try {
          s.emit("driver:location", {
            orderId: String(orderId).trim(),
            lat: daLastLat,
            lng: daLastLng,
            speed: daLastSpeed,
            heading: daLastHeading,
          });
        } catch (e) {}
      }

      async function pushLocationRest(orderId) {
        if (daLastLat == null || daLastLng == null) return;
        try {
          await window.PlatformAPI.api("/api/driver/update-location", {
            method: "POST",
            body: { lat: daLastLat, lng: daLastLng, order_id: String(orderId).trim() },
          });
        } catch (e) {
          if (daLocStatus) daLocStatus.textContent = "تعذّر إرسال الموقع: " + (e.message || e);
        }
      }

      function stopTrackingLoops() {
        if (daSendTimer) {
          clearInterval(daSendTimer);
          daSendTimer = null;
        }
        if (daWatchId != null && navigator.geolocation) {
          try {
            navigator.geolocation.clearWatch(daWatchId);
          } catch (e) {}
          daWatchId = null;
        }
      }

      function startTrackingLoops(orderId) {
        stopTrackingLoops();
        if (!orderId || !navigator.geolocation) {
          if (daLocStatus) daLocStatus.textContent = "المتصفح لا يدعم تحديد الموقع.";
          return;
        }
        joinOrderRoom(orderId);
        if (daLocStatus) daLocStatus.textContent = "جاري تفعيل GPS…";
        daWatchId = navigator.geolocation.watchPosition(
          function (pos) {
            daLastLat = pos.coords.latitude;
            daLastLng = pos.coords.longitude;
            daLastSpeed = pos.coords.speed != null ? Number(pos.coords.speed) : null;
            daLastHeading = pos.coords.heading != null ? Number(pos.coords.heading) : null;
            updateSelfMarker(daLastLat, daLastLng);
            if (daLocStatus) daLocStatus.textContent = "📍 الموقع نشط — يُحدَّث كل ~2.5 ث";
          },
          function () {
            if (daLocStatus) daLocStatus.textContent = "تعذّر قراءة GPS — تحقق من أذونات الموقع.";
          },
          { enableHighAccuracy: true, maximumAge: 4000, timeout: 20000 }
        );
        daSendTimer = setInterval(function () {
          if (!daActiveOrder || !daActiveOrder.id) return;
          var st = String(daActiveOrder.delivery_status || daActiveOrder.status || "").toLowerCase();
          if (!["accepted", "picked", "delivering"].includes(st)) return;
          void pushLocationRest(daActiveOrder.id);
          pushLocationSocket(daActiveOrder.id);
        }, 2500);
      }

      function refreshActionButtons() {
        var o = daActiveOrder;
        var st = o ? String(o.delivery_status || o.status || "").toLowerCase() : "";
        var startBtn = document.getElementById("daBtnStart");
        var arrBtn = document.getElementById("daBtnArrived");
        var delBtn = document.getElementById("daBtnDelivered");
        if (!startBtn || !arrBtn || !delBtn) return;
        startBtn.disabled = !o || !["accepted", "picked"].includes(st);
        arrBtn.disabled = !o || st !== "delivering";
        delBtn.disabled = !o || st !== "delivering";
      }

      async function loadOrderById(id) {
        showErr("");
        var j = await window.PlatformAPI.api("/api/delivery/orders/" + encodeURIComponent(id));
        if (!j || !j.order) throw new Error("الطلب غير موجود");
        daActiveOrder = j.order;
        if (daOrderStatus) {
          daOrderStatus.textContent = "الحالة: " + (daActiveOrder.delivery_status || daActiveOrder.status || "—");
        }
        updateTrackView();
        renderOrderOnMap(daActiveOrder);
        refreshActionButtons();
        startTrackingLoops(daActiveOrder.id);
      }

      async function refreshOrdersList() {
        var box = document.getElementById("daOrders");
        if (!box) return;
        box.innerHTML = '<p class="driver-app-loading">جاري التحميل…</p>';
        try {
          var j = await window.PlatformAPI.api("/api/driver/orders");
          var orders = j.orders || [];
          box.innerHTML = "";
          if (!orders.length) {
            box.innerHTML = '<div class="drv-empty-state">لا توجد طلبات حالياً.</div>';
            return;
          }
          var STATUS = {
            new: "جديد",
            pending: "انتظار",
            accepted: "مقبول",
            delivering: "توصيل",
            delivered: "مُسلَّم",
          };
          orders.forEach(function (o) {
            var st = String(o.delivery_status || o.status || "");
            var row = document.createElement("div");
            row.className = "driver-app-order-item";
            var body = "<p class=\"driver-app-order-addr\">📍 " + ErvenowDriverNav.escHtml(o.drop_address || "—") + "</p>";
            row.innerHTML = ErvenowDriverNav.orderCardHtml(o, {
              statusLabel: STATUS[st] || st,
              bodyHtml: body,
              actionsHtml:
                '<button type="button" class="drv-btn drv-btn--gold da-open-track">فتح التتبع الحي</button>',
            });
            row.querySelector(".da-open-track").onclick = function () {
              location.hash = "#track";
              syncHashUi();
              void loadOrderById(o.id).catch(function (e) {
                showErr(e.message || String(e));
              });
            };
            box.appendChild(row);
          });
        } catch (e) {
          box.innerHTML = "";
          showErr(e.message || String(e));
        }
      }

      document.getElementById("daBtnRefreshOrders").onclick = function () {
        void refreshOrdersList();
      };

      document.getElementById("daBtnStart").onclick = async function () {
        if (!daActiveOrder || !daActiveOrder.id) return;
        showErr("");
        try {
          var j = await window.PlatformAPI.api("/api/driver/start-delivery/" + encodeURIComponent(daActiveOrder.id), {
            method: "POST",
          });
          if (j.order) {
            daActiveOrder = j.order;
            if (daOrderStatus) daOrderStatus.textContent = "الحالة: " + (daActiveOrder.delivery_status || "");
            refreshActionButtons();
          }
        } catch (e) {
          showErr(e.message || String(e));
        }
      };

      document.getElementById("daBtnArrived").onclick = async function () {
        if (!daActiveOrder || !daActiveOrder.id) return;
        showErr("");
        try {
          await window.PlatformAPI.api("/api/driver/ping-arrival/" + encodeURIComponent(daActiveOrder.id), {
            method: "POST",
          });
          if (daLocStatus) daLocStatus.textContent = "✅ تم إبلاغ العميل بالوصول.";
        } catch (e) {
          showErr(e.message || String(e));
        }
      };

      document.getElementById("daBtnDelivered").onclick = async function () {
        if (!daActiveOrder || !daActiveOrder.id) return;
        if (!confirm("تأكيد تم تسليم الطلب للعميل؟")) return;
        showErr("");
        try {
          var j = await window.PlatformAPI.api("/api/driver/complete-order/" + encodeURIComponent(daActiveOrder.id), {
            method: "POST",
          });
          if (j.order) {
            daActiveOrder = j.order;
            if (daOrderStatus) daOrderStatus.textContent = "الحالة: " + (daActiveOrder.delivery_status || "");
            stopTrackingLoops();
            refreshActionButtons();
          }
        } catch (e) {
          showErr(e.message || String(e));
        }
      };

      updateTrackView();

      (async function boot() {
        try {
          var me = await window.PlatformAPI.api("/api/core/me");
          daMeRole = me && me.profile && me.profile.role;
          if (String(daMeRole || "").toLowerCase() !== "driver") {
            document.body.innerHTML =
              '<div class="driver-auth-gate"><h2>هذه اللوحة للمناديب فقط</h2><a class="drv-btn drv-btn--gold" href="/track">صفحة التتبع للعميل</a></div>';
            return;
          }
        } catch (e) {
          showErr(e.message || String(e));
        }

        syncHashUi();
        void refreshOrdersList();

        var params = new URLSearchParams(location.search);
        var qOrder = (params.get("order") || params.get("id") || "").trim();
        if (qOrder) {
          location.hash = "#track";
          syncHashUi();
          void loadOrderById(qOrder).catch(function (e) {
            showErr(e.message || String(e));
            location.hash = "#orders";
            syncHashUi();
          });
        }
      })();
    </script>
  </body>
</html>
