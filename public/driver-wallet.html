<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ERVENOW | رصيد المندوب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/guest-shell.css" />
    <link rel="stylesheet" href="/assets/driver-shell.css" />
  </head>
  <body class="guest-shell-page driver-page driver-wallet-page">
    <div id="driverShellHeader"></div>
    <div class="dash-main">
      <div id="driverShellHero"></div>
      <div class="layout">
        <div class="drv-wallet-hero" aria-live="polite">
          <p class="drv-wallet-hero__label">رصيدك المتاح</p>
          <p class="drv-wallet-hero__amount" id="balanceMain">
            <span id="balanceAmount">…</span>
            <span>ر.س</span>
          </p>
          <div class="drv-wallet-stats">
            <div class="drv-wallet-stat">
              إجمالي المكتسب
              <strong id="statEarned">—</strong>
            </div>
            <div class="drv-wallet-stat">
              إجمالي المسحوب
              <strong id="statWithdrawn">—</strong>
            </div>
          </div>
          <p class="muted" id="balanceHint" style="display: none; margin: 12px 0 0; color: rgba(255,253,248,0.85); font-size: 0.82rem"></p>
        </div>

        <div class="drv-wallet-panel">
          <h3>سحب الأموال</h3>
          <p class="muted">أدخل المبلغ و<strong>نفس الآيبان المسجّل</strong> — يصلك رمز واتساب للتأكيد.</p>
          <div class="drv-wallet-inputs">
            <input id="amount" type="number" min="20" step="0.01" placeholder="المبلغ (20 ر.س كحد أدنى)" />
            <input id="withdrawIban" type="text" placeholder="تأكيد الآيبان (SA…)" translate="no" />
          </div>
          <div class="drv-wallet-inputs">
            <button class="drv-wallet-btn drv-wallet-btn--primary" id="sendOtpBtn" type="button">إرسال رمز السحب</button>
            <input id="otpCode" placeholder="رمز التحقق" />
            <button class="drv-wallet-btn drv-wallet-btn--ghost" id="confirmOtpBtn" type="button">تأكيد السحب</button>
          </div>
          <p class="muted" id="otpHint"></p>
        </div>

        <div class="drv-wallet-panel drv-wallet-panel--tx">
          <button
            type="button"
            class="drv-wallet-tx-toggle"
            id="txToggleBtn"
            aria-expanded="false"
            aria-controls="txPanel"
          >
            <span class="drv-wallet-tx-toggle__main">
              <span id="txToggleLabel">سجل العمليات</span>
              <span class="drv-wallet-tx-toggle__count" id="txCount" hidden>0</span>
            </span>
            <span class="drv-wallet-tx-toggle__chev" aria-hidden="true">▼</span>
          </button>
          <div id="txPanel" class="drv-wallet-tx-panel" hidden>
            <div id="txList"><p class="muted">جارٍ التحميل…</p></div>
          </div>
        </div>
      </div>
      <div id="driverShellFooter"></div>
    </div>

    <script src="/assets/api-config.js"></script>
    <script src="/assets/api.js"></script>
    <script src="/assets/driver-nav.js"></script>
    <script>
      ErvenowDriverNav.mount({
        activeNav: "driver",
        pageTag: "رصيد المندوب",
        hero: {
          title: "محفظة المندوب",
          sub: "رصيدك وأرباحك وسحوباتك — بتجربة آمنة ومريحة.",
          eyebrow: "ERVENOW — شريك التوصيل",
        },
      });

      window.__ERVENOW_FETCH_TIMEOUT_MS = 30000;

      if (!window.PlatformAPI || !window.PlatformAPI.getToken()) {
        location.href = "/driver-login";
      }

      function fmtMoney(n) {
        var x = Number(n);
        if (!Number.isFinite(x)) x = 0;
        return x.toLocaleString("ar-SA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function showToast(msg, ok) {
        var el = document.createElement("div");
        el.className = "drv-toast " + (ok ? "drv-toast--ok" : "drv-toast--err");
        el.textContent = String(msg || "");
        document.body.appendChild(el);
        setTimeout(function () {
          try {
            el.remove();
          } catch (_e) {}
        }, ok ? 3500 : 5000);
      }

      function renderBalance(w) {
        var bal = w && w.balance != null ? Number(w.balance) : 0;
        var earned = w && w.total_earned != null ? Number(w.total_earned) : 0;
        var withdrawn = w && w.total_withdrawn != null ? Number(w.total_withdrawn) : 0;
        document.getElementById("balanceAmount").textContent = fmtMoney(bal);
        document.getElementById("statEarned").textContent = fmtMoney(earned) + " ر.س";
        document.getElementById("statWithdrawn").textContent = fmtMoney(withdrawn) + " ر.س";
        var hint = document.getElementById("balanceHint");
        if (hint) {
          var msg =
            (w && w.message) ||
            (w && w.setup_required
              ? "نظام المحفظة غير مفعّل على الخادم — تواصل مع الإدارة لتفعيل هجرة ledger"
              : "") ||
            (w && w.note) ||
            "";
          if (msg) {
            hint.style.display = "block";
            hint.textContent = String(msg);
          } else {
            hint.style.display = "none";
            hint.textContent = "";
          }
        }
        if (window.ErvenowDriverNav && ErvenowDriverNav.refreshBalanceChip) {
          ErvenowDriverNav.refreshBalanceChip();
        }
      }

      async function loadWallet() {
        try {
          var w = await window.PlatformAPI.api("/api/driver/wallet");
          renderBalance(w);
          return;
        } catch (e1) {
          try {
            var w2 = await window.PlatformAPI.api("/api/wallet");
            renderBalance(w2);
          } catch (e2) {
            renderBalance({ balance: 0, total_earned: 0, total_withdrawn: 0, note: "تعذّر مزامنة الرصيد" });
            showToast((e2 && e2.message) || "تعذّر تحميل الرصيد", false);
          }
        }
      }

      var txPanelOpen = false;

      function updateTxCount(count) {
        var badge = document.getElementById("txCount");
        if (!badge) return;
        if (count > 0) {
          badge.hidden = false;
          badge.textContent = String(count);
        } else {
          badge.hidden = true;
          badge.textContent = "0";
        }
      }

      function setTxPanelOpen(open) {
        txPanelOpen = !!open;
        var panel = document.getElementById("txPanel");
        var btn = document.getElementById("txToggleBtn");
        var label = document.getElementById("txToggleLabel");
        if (panel) panel.hidden = !txPanelOpen;
        if (btn) {
          btn.setAttribute("aria-expanded", txPanelOpen ? "true" : "false");
          btn.classList.toggle("is-open", txPanelOpen);
        }
        if (label) label.textContent = txPanelOpen ? "إخفاء سجل العمليات" : "سجل العمليات";
      }

      async function loadTransactions(options) {
        var opts = options || {};
        var openAfterLoad = !!opts.openAfterLoad;
        var box = document.getElementById("txList");
        if (txPanelOpen || openAfterLoad) {
          box.innerHTML = '<p class="muted">جارٍ التحميل…</p>';
        }
        try {
          var j = await window.PlatformAPI.api("/api/wallet/transactions");
          var rows = j.transactions || [];
          updateTxCount(rows.length);
          box.innerHTML = "";
          if (!rows.length) {
            box.innerHTML = '<div class="drv-empty-state">لا توجد عمليات بعد</div>';
            if (openAfterLoad) setTxPanelOpen(true);
            return;
          }
          rows.forEach(function (t) {
            var div = document.createElement("div");
            div.className = "drv-wallet-tx";
            var type = String(t.type || "").toLowerCase();
            var label =
              type === "earning" || type === "credit"
                ? "💰 إيداع"
                : type === "withdraw"
                  ? "🏦 سحب"
                  : t.type || "—";
            var amt = Number(t.amount) || 0;
            var sign = type === "withdraw" ? "−" : "+";
            div.innerHTML =
              "<strong>" +
              label +
              "</strong>" +
              '<div style="font-size:1.05rem;font-weight:900;color:#3d2213;margin:4px 0">' +
              sign +
              " " +
              fmtMoney(amt) +
              " ر.س</div>" +
              "<div>" +
              (t.note || "—") +
              "</div>" +
              '<div class="muted" style="margin-top:4px;font-size:0.8rem">' +
              (t.created_at || "") +
              "</div>";
            box.appendChild(div);
          });
          if (openAfterLoad) setTxPanelOpen(true);
        } catch (e) {
          updateTxCount(0);
          if (txPanelOpen || openAfterLoad) {
            box.innerHTML = '<div class="drv-empty-state">لا توجد عمليات</div>';
          }
        }
      }

      function toggleTxPanel() {
        if (txPanelOpen) {
          setTxPanelOpen(false);
          return;
        }
        loadTransactions({ openAfterLoad: true });
      }

      var otpLockTimer = null;
      function setConfirmLock(seconds) {
        var btn = document.getElementById("confirmOtpBtn");
        if (!btn) return;
        if (otpLockTimer) {
          clearInterval(otpLockTimer);
          otpLockTimer = null;
        }
        var remain = Number(seconds) || 0;
        if (remain <= 0) {
          btn.disabled = false;
          btn.textContent = "تأكيد السحب";
          return;
        }
        btn.disabled = true;
        btn.textContent = "مقفول (" + remain + "ث)";
        otpLockTimer = setInterval(function () {
          remain -= 1;
          if (remain <= 0) {
            clearInterval(otpLockTimer);
            otpLockTimer = null;
            btn.disabled = false;
            btn.textContent = "تأكيد السحب";
            return;
          }
          btn.textContent = "مقفول (" + remain + "ث)";
        }, 1000);
      }

      function extractLockSeconds(message) {
        var msg = String(message || "");
        var m1 = msg.match(/lock_seconds["':\s]*([0-9]+)/i);
        if (m1 && m1[1]) return Number(m1[1]);
        var m2 = msg.match(/([0-9]+)\s*ثانية/);
        if (m2 && m2[1]) return Number(m2[1]);
        return 0;
      }

      var actionBusy = false;
      function safeClick(fn) {
        return async function () {
          if (actionBusy) return;
          actionBusy = true;
          try {
            await fn.apply(this, arguments);
          } finally {
            actionBusy = false;
          }
        };
      }

      document.getElementById("sendOtpBtn").onclick = safeClick(async function () {
        var amt = Number(document.getElementById("amount").value);
        if (!Number.isFinite(amt) || amt < 20) {
          showToast("الحد الأدنى للسحب 20 ريال", false);
          return;
        }
        var ibanC = String(document.getElementById("withdrawIban").value || "").trim();
        if (!ibanC) {
          showToast("أدخل الآيبان لتأكيد المطابقة", false);
          return;
        }
        try {
          var r = await window.PlatformAPI.api("/api/wallet/withdraw/send-otp", {
            method: "POST",
            body: { amount: amt, iban: ibanC },
          });
          document.getElementById("otpHint").textContent = r.dev_otp
            ? "رمز التطوير: " + r.dev_otp
            : "تم إرسال رمز التحقق إلى جوالك";
          showToast("تم إرسال رمز السحب", true);
        } catch (e) {
          var lockSec1 = extractLockSeconds(e.message);
          if (lockSec1 > 0) setConfirmLock(lockSec1);
          showToast(e.message || "تعذر إرسال الرمز", false);
        }
      });

      document.getElementById("confirmOtpBtn").onclick = safeClick(async function () {
        var code = (document.getElementById("otpCode").value || "").trim();
        if (!code) {
          showToast("اكتب رمز التحقق", false);
          return;
        }
        try {
          var ibanC2 = String(document.getElementById("withdrawIban").value || "").trim();
          await window.PlatformAPI.api("/api/wallet/withdraw/confirm-otp", {
            method: "POST",
            body: { code: code, iban: ibanC2 },
          });
          showToast("تم إرسال طلب السحب للإدارة", true);
          document.getElementById("otpCode").value = "";
          document.getElementById("otpHint").textContent = "";
          setConfirmLock(0);
          await loadWallet();
          await loadTransactions({ openAfterLoad: txPanelOpen });
        } catch (e) {
          var lockSec2 = extractLockSeconds(e.message);
          if (lockSec2 > 0) setConfirmLock(lockSec2);
          showToast(e.message || "تعذر تأكيد الرمز", false);
        }
      });

      document.getElementById("txToggleBtn").onclick = toggleTxPanel;

      loadWallet();
      loadTransactions({ openAfterLoad: false });
    </script>
  </body>
</html>
