<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <script src="/assets/viewport-fit.js"></script>
    <title>معاينة | صفحة المتاجر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/responsive-audit-base.css" />
    <link rel="stylesheet" href="/assets/ervenow-responsive.css" />
    <link rel="stylesheet" href="/assets/preview-restaurants-hub.css" />
  </head>
  <body class="preview-rest-page">
    <header class="preview-rest-banner">
      <div class="preview-rest-banner__inner">
        <p class="preview-rest-banner__tag">معاينة فقط — لم يُطبَّق بعد</p>
        <h1 class="preview-rest-banner__title">صفحة المتاجر</h1>
        <nav class="preview-hub-nav" aria-label="معاينة الأقسام">
          <a href="/preview/restaurants-hub.html">🍽️ مطاعم</a>
          <a href="/preview/stores-hub.html" class="is-active" aria-current="page">🛒 متاجر</a>
          <a href="/preview/delivery-hub.html">🚚 توصيل</a>
          <a href="/preview/services-hub.html">🔧 خدمات</a>
          <a href="/preview/">الفهرس</a>
        </nav>
      </div>
    </header>

    <div class="preview-rest-shell">
      <header class="preview-rest-hero preview-rest-hero--stores">
        <h1>🛒 متاجر</h1>
        <p>تصنيفات أعلى — المتاجر تحت. بدون اختيار: <strong>كل المتاجر</strong> تظهر تلقائياً.</p>
      </header>

      <div class="preview-rest-toolbar">
        <div class="preview-rest-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="M20 20l-4.3-4.3" stroke-linecap="round" />
          </svg>
          <input type="search" class="preview-rest-search" id="hubSearch" placeholder="ابحث باسم المتجر…" autocomplete="off" />
        </div>
        <div class="preview-rest-sort" role="group" aria-label="ترتيب">
          <button type="button" class="preview-rest-sort__btn is-active" data-sort="nearest">📍 الأقرب</button>
          <button type="button" class="preview-rest-sort__btn" data-sort="rating">⭐ الأعلى تقييماً</button>
          <button type="button" class="preview-rest-sort__btn" data-sort="offers">🎁 عروض</button>
        </div>
      </div>

      <section class="preview-rest-cats" aria-label="تصنيفات المتاجر">
        <div class="preview-rest-cats__head">
          <span aria-hidden="true">🛒</span>
          <div>
            <strong>تصنيفات المتاجر</strong>
            <small>سوبرماركت، صيدليات، خضار… أو «الكل»</small>
          </div>
        </div>
        <div class="preview-rest-cats__scroll" id="catBar" role="tablist"></div>
      </section>

      <p class="preview-rest-status" id="statusLine" aria-live="polite">—</p>
      <div class="preview-rest-grid" id="hubGrid" aria-label="قائمة المتاجر"></div>
      <footer class="preview-rest-foot">
        <p>بيانات تجريبية — الصفحة الحقيقية: <a href="/stores">/stores</a></p>
      </footer>
    </div>

    <script src="/assets/preview-section-hub.js"></script>
    <script>
      initPreviewHub({
        queryKey: "type",
        entityLabel: "متجر",
        entityPlural: "متاجر",
        ctaLabel: "عرض المتجر",

          { id: "flowers_gifts", icon: "💐", label: "ورود وهدايا" },
          { id: "sweets", icon: "🍰", label: "حلويات" },
          { id: "home_business", icon: "🏠", label: "أسر منتجة" },
        ],
        items: [
          { id: "s1", name: "سوبرماركت النور", category: "supermarket", label: "سوبر ماركت", rating: 4.7, km: 1.1, offer: true, icon: "🛒" },
          { id: "s2", name: "صيدلية الشفاء", category: "pharmacy", label: "صيدليات", rating: 4.8, km: 0.9, offer: false, icon: "💊" },

          { id: "s5", name: "حلويات الفردوس", category: "sweets", label: "حلويات", rating: 4.4, km: 1.8, offer: true, icon: "🍰" },
          { id: "s6", name: "مطبخ أم نورة", category: "home_business", label: "أسر منتجة", rating: 4.9, km: 2.5, offer: false, icon: "🏠" },
          { id: "s7", name: "هايبر ماركت العائلة", category: "supermarket", label: "سوبر ماركت", rating: 4.3, km: 4.2, offer: false, icon: "🛒" },
          { id: "s8", name: "صيدلية 24", category: "pharmacy", label: "صيدليات", rating: 4.2, km: 5.1, offer: true, icon: "💊" },
        ],
      });
    </script>
  </body>
</html>
