<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <script src="/assets/viewport-fit.js?erv=20260612b"></script>
    <title>لوحة الإدارة الموحّدة | ERVENOW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --adm-bg: #0f1115;
        --adm-side: #1c2230;
        --adm-gold: #c9a24a;
        --adm-border: rgba(201, 162, 74, 0.22);
        --adm-muted: #8b92a3;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Cairo", system-ui, sans-serif;
        background: var(--adm-bg);
        color: #eef0f5;
      }

      .adm-shell {
        display: flex;
        flex-direction: row;
        height: 100%;
        min-height: 100dvh;
      }

      /* في RTL العنصر الأول يظهر يمين الشاشة → الشريط الجانبي */
      .adm-side {
        width: min(260px, 88vw);
        flex-shrink: 0;
        background: var(--adm-side);
        border-inline-start: 1px solid var(--adm-border);
        display: flex;
        flex-direction: column;
        padding: 18px 0;
      }

      .adm-brand {
        padding: 0 18px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        margin-bottom: 12px;
      }

      .adm-brand h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--adm-gold);
        letter-spacing: 0.04em;
      }

      .adm-brand p {
        margin: 6px 0 0;
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--adm-muted);
      }

      .adm-nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 0 12px;
        flex: 1;
      }

      .adm-nav-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 12px 14px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: var(--adm-muted);
        font: inherit;
        font-size: 0.94rem;
        font-weight: 700;
        text-align: start;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }

      .adm-nav-btn:hover {
        background: rgba(201, 162, 74, 0.1);
        color: #dce0ea;
      }

      .adm-nav-btn.is-active {
        background: rgba(201, 162, 74, 0.18);
        color: var(--adm-gold);
        box-shadow: inset 3px 0 0 var(--adm-gold);
      }

      .adm-nav-btn .adm-ic {
        font-size: 1.15rem;
        line-height: 1;
        width: 1.35em;
        text-align: center;
      }

      .adm-foot {
        padding: 12px 18px;
        margin-top: auto;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .adm-foot a {
        color: var(--adm-muted);
        font-size: 0.82rem;
        font-weight: 700;
        text-decoration: none;
      }

      .adm-foot a:hover {
        color: var(--adm-gold);
      }

      .adm-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--adm-bg);
      }

      .adm-frame-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 12px 12px 12px 8px;
      }

      .adm-frame {
        flex: 1;
        width: 100%;
        border: 1px solid var(--adm-border);
        border-radius: 12px;
        background: var(--adm-side);
      }
    </style>
      <link rel="stylesheet" href="/assets/responsive-audit-base.css" />
  </head>
  <body>
    <div class="adm-shell">
      <aside class="adm-side" aria-label="قائمة الإدارة">
        <div class="adm-brand">
          <h1>ERVENOW</h1>
          <p>لوحة تحكم موحّدة</p>
        </div>
        <nav class="adm-nav">
          <button type="button" class="adm-nav-btn is-active" data-src="/admin-dashboard" id="tabDash">
            <span class="adm-ic" aria-hidden="true">📊</span>
            Dashboard
          </button>
          <button type="button" class="adm-nav-btn" data-src="/admin-settings" id="tabSettings">
            <span class="adm-ic" aria-hidden="true">⚙️</span>
            Settings
          </button>
          <button type="button" class="adm-nav-btn" data-src="/admin/branding" id="tabBrand">
            <span class="adm-ic" aria-hidden="true">🎨</span>
            Branding
          </button>
        </nav>
        <footer class="adm-foot">
          <a href="/">← الموقع العام</a>
        </footer>
      </aside>

      <main class="adm-main">
        <div class="adm-frame-wrap">
          <iframe
            class="adm-frame"
            id="admFrame"
            title="محتوى الإدارة"
            src="/admin-dashboard"
          ></iframe>
        </div>
      </main>
    </div>

    <script>
      (function () {
        var frame = document.getElementById("admFrame");
        var buttons = document.querySelectorAll(".adm-nav-btn");

        function activate(btn) {
          for (var i = 0; i < buttons.length; i++) {
            var b = buttons[i];
            var on = b === btn;
            b.classList.toggle("is-active", on);
            if (on) b.setAttribute("aria-current", "page");
            else b.removeAttribute("aria-current");
          }
        }

        for (var j = 0; j < buttons.length; j++) {
          buttons[j].addEventListener("click", function () {
            var src = this.getAttribute("data-src");
            if (!src || !frame) return;
            activate(this);
            frame.src = src;
          });
        }

        document.getElementById("tabDash").setAttribute("aria-current", "page");
      })();
    </script>
  </body>
</html>
